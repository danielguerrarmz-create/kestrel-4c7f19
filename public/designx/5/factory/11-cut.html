<script>(()=>{const DRAWING_META={"id":"11-cut","number":"11","title":"Cut","stage":"Detail","whatHappens":"The robot mills half-laps in the rib on trestles, scans the cut faces, then carves ornament with the same spindle.","bower":"Three Bower-specific proposals: the joint schedule from the engine becomes the toolpath; the fit is checked by scanning the cut faces; ornament is carved into structural timber in a reserved depth. The robot, track, spindle, tool changer and half-lap milling are industry practice.","testing":"Robot-milled finger and Japanese splices on a rib-depth curved offcut (register T6): assumed, to be tested. Only laps and scarf are proven on a robot; the finger splice stays on its fixed machine (03). The accept limit for joint fit (T7): assumed, to be tested. A scan-based fit check of the cut faces, with no published practice (T8): assumed, to be tested. Robot milling stiffness on a 22 m rib, since a robot arm is over 50 times less stiff than a gantry (T10): assumed, to be tested.","sourceLinks":[{"title":"ICD Stuttgart, BUGA Wood Pavilion 2019: two KUKA KR 500 FORTEC robots milled finger joints and openings to 0.3 mm. Industry precedent, plywood plates, not glulam (KUKA case study, snippet).","url":"https://kuka.com/en-cn/industries/loesungsdatenbank/2019/07/icd-wooden-pavilion-for-buga"},{"title":"UAS Technikum Wien, DAAAM 2024: a KUKA KR 16-2 with a spindle milled classic wood joints; 13 of 14 measured cuts fell within -0.020 to +0.378 mm. Research precedent, not Bower's result (read).","url":"https://www.daaam.info/Downloads/Pdfs/proceedings/proceedings_2024/034.pdf"},{"title":"Monumental Labs carves architectural stone with KUKA robot arms and hand finishing. Stone, not timber (Architectural Record, 2026, read).","url":"https://www.architecturalrecord.com/articles/18004-monumental-labs-turns-to-automation-and-robots-to-revive-the-art-of-stone-carving"}]};
const S={};
const SQ=Math.sqrt(3)/2, TAU=Math.PI*2;
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const CP=Math.cos(.575),SP=Math.sin(.575);
const mkP=(ox,oy,s)=>(x,y,z)=>[ox+(x*CP-y*SP)*s, oy+((x*SP+y*CP)*.5-z)*s];
const n1=v=>v.toFixed(1);
const pd=(pts,close=true)=>'M'+pts.map(p=>n1(p[0])+' '+n1(p[1])).join('L')+(close?'Z':'');
function hull(pts){pts=pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);const lo=[];for(const p of pts){while(lo.length>1&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p);}const up=[];for(let i=pts.length-1;i>=0;i--){const p=pts[i];while(up.length>1&&cr(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p);}up.pop();lo.pop();return lo.concat(up);}
function circ(cx,cy,r,n=16){const a=[];for(let i=0;i<n;i++){const t=i/n*TAU+.3;a.push([cx+r*Math.cos(t),cy+r*Math.sin(t)]);}return a;}
function rr(u0,v0,u1,v1,r){r=r||0;if(r<.005)return[[u0,v0],[u1,v0],[u1,v1],[u0,v1]];r=Math.min(r,(u1-u0)/2,(v1-v0)/2);const o=[];for(const[cx,cy,a0]of[[u1-r,v0+r,-90],[u1-r,v1-r,0],[u0+r,v1-r,90],[u0+r,v0+r,180]])for(let k=0;k<=3;k++){const a=(a0+k*30)*Math.PI/180;o.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]);}return o;}
const cap2=(p,q,r0,r1)=>hull(circ(p[0],p[1],r0,14).concat(circ(q[0],q[1],r1,14)));
const mixHex=(a,b,k)=>{const h=x=>[1,3,5].map(i=>parseInt(x.slice(i,i+2),16)),A=h(a),B=h(b);return'#'+A.map((v,i)=>Math.round(lerp(v,B[i],clamp(k))).toString(16).padStart(2,'0')).join('');};

const sst=t=>{t=clamp(t);return t*t*(3-2*t)};
const ease=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const eout=t=>1-Math.pow(1-clamp(t),3);
const seg=(t,a,b)=>clamp((t-a)/(b-a));

const stepIndex=(t,bounds)=>{for(let i=0;i<bounds.length-1;i++)if(t<bounds[i+1])return i;return bounds.length-2;};

function ext(c,plane,poly,a0,a1,o){o=o||{};const P=c.P;
  const q=(p,a)=>plane==='yz'?P(a,p[0],p[1]):plane==='xz'?P(p[0],a,p[1]):P(p[0],p[1],a);
  const p0=poly.map(p=>q(p,a0)),p1=poly.map(p=>q(p,a1));
  return S.solid(hull(p0.concat(p1)),p1,o,c);}
const ln=(c,pts,cls,o)=>{o=o||{};return`<path d="${pd(pts.map(p=>c.P(p[0],p[1],p[2])),false)}" fill="none" stroke="${o.col||S.ink}" stroke-width="${o.w||.6}" ${o.dash?`stroke-dasharray="${o.dash}"`:''} stroke-linecap="round" stroke-linejoin="round" ${o.op!=null?`opacity="${n1(o.op)}"`:''}/>`;};

function hatchRect(P,x,y0,y1,z0,z1,step,dir){ // hatch inside a rectangle of the plane x=const
  let d='';const h=z1-z0,w=y1-y0;
  for(let k=-h;k<w;k+=step){ // line z = z0 + dir*(y-y0-k)
    let ya=y0+Math.max(0,k),yb=y0+Math.min(w,k+h);if(yb<=ya)continue;
    const f=y=>dir>0?z0+(y-y0-k):z1-(y-y0-k);
    const a=P(x,ya,f(ya)),b=P(x,yb,f(yb));d+=`M${n1(a[0])} ${n1(a[1])}L${n1(b[0])} ${n1(b[1])}`;}
  return d;}

/* ---- machine parts: frames, fasteners, hoses, linear track, cable chain, six-axis arm ---- */
// Frames wrap a context so any extrusion can be drawn in a moved or rotated local system.
// c.ax holds the world direction of each local axis; it decides which end cap faces the viewer.
const AX0=[[1,0,0],[0,1,0],[0,0,1]];
const v3={add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],sc:(a,k)=>[a[0]*k,a[1]*k,a[2]*k],
 cr:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
 nz:a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return[a[0]/l,a[1]/l,a[2]/l];}};
function frameC(c,o,ex,ey,ez){const A=c.ax||AX0,w=e=>[0,1,2].map(i=>e[0]*A[0][i]+e[1]*A[1][i]+e[2]*A[2][i]);
 return{P:(a,b,d)=>c.P(o[0]+a*ex[0]+b*ey[0]+d*ez[0],o[1]+a*ex[1]+b*ey[1]+d*ez[1],o[2]+a*ex[2]+b*ey[2]+d*ez[2]),ax:[w(ex),w(ey),w(ez)]};}
// Local z runs along d from o.
function alongC(c,o,d){const z=v3.nz(d),r=Math.abs(z[0])<.9?[1,0,0]:[0,1,0];const x=v3.nz(v3.add(r,v3.sc(z,-v3.dot(r,z))));return frameC(c,o,x,v3.cr(z,x),z);}
const facing=(c,k)=>{const v=(c.ax||AX0)[k];return v[0]*SP+v[1]*CP+v[2]*.5>=0;};
// Extrusion with its outlined cap always on the end nearest the viewer.
function xt(c,plane,poly,a0,a1,o){const k=plane==='yz'?0:plane==='xz'?1:2;return facing(c,k)===(a1>=a0)?ext(c,plane,poly,a0,a1,o||{}):ext(c,plane,poly,a1,a0,o||{});}
// Cylinder along a local axis; (u,v) is the centre in the other two axes, in xyz order.
function cyl(c,axis,u,v,r,a0,a1,o,n){const p=circ(u,v,r,n||14);return xt(c,axis==='z'?'xy':axis==='y'?'xz':'yz',p,a0,a1,o);}
const q3=(plane,u,v,a)=>plane==='yz'?[a,u,v]:plane==='xz'?[u,a,v]:[u,v,a];
const matFill=()=>typeof MAT!=='undefined'&&MAT?MAT.steel:S.paper;
// Hex heads or nuts lying on a face, one path.
function hexes(c,plane,pts,at,r){let d='';for(const[u,v]of pts){const h=[];for(let k=0;k<6;k++){const a=k*Math.PI/3+.26;h.push(c.P(...q3(plane,u+r*Math.cos(a),v+r*Math.sin(a),at)));}d+=pd(h);}
 return`<path d="${d}" fill="${matFill()}" stroke="${S.ink}" stroke-width=".5"/>`;}
// Circles on a face (bores, bolt holes, lenses), one path.
function rings(c,plane,pts,at,r,o){o=o||{};let d='';for(const[u,v]of pts)d+=pd(circ(u,v,r,o.n||12).map(p=>c.P(...q3(plane,p[0],p[1],at))));
 return`<path d="${d}" fill="${o.fill||'none'}" stroke="${o.col||S.ink}" stroke-width="${o.w||.5}" ${o.dash?`stroke-dasharray="${o.dash}"`:''}/>`;}
// Inner edges on a face as one path of polylines.
function edges(c,lines,o){o=o||{};let d='';for(const l of lines)d+=pd(l.map(p=>c.P(...p)),false);
 return`<path d="${d}" fill="none" stroke="${o.col||S.ink}" stroke-width="${o.w||.5}" ${o.dash?`stroke-dasharray="${o.dash}"`:''} stroke-linecap="round"/>`;}
const bez=(a,b,c2,d,n)=>Array.from({length:n+1},(_,k)=>{const u=k/n,p=(1-u)**3,q=3*u*(1-u)**2,r=3*u*u*(1-u),s=u**3;return[0,1,2].map(i=>p*a[i]+q*b[i]+r*c2[i]+s*d[i]);});
// A hose or cable: an outlined tube of width w drawing units in pixels.
function hose(c,pts,w,o){o=o||{};const d=pd(pts.map(p=>c.P(...p)),false);
 return`<path d="${d}" fill="none" stroke="${o.col||S.ink}" stroke-width="${n1(w+1.1)}" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${S.paper}" stroke-width="${n1(Math.max(.4,w-.1))}" stroke-linecap="round" stroke-linejoin="round"/>`;}

/* Linear track, KUKA KL 4000 class: feet, box beam, two profile rails, rack, end stops, trough. */
function trackBase(c,{x0,x1,y}){let s='';
 for(let x=x0+.7;x<x1-.3;x+=3.4){
  s+=xt(c,'xy',rr(x-.42,y-.82,x+.42,y+.82),0,.06,{m:'dark'});
  s+=hexes(c,'xy',[[x-.3,y-.68],[x+.3,y-.68],[x-.3,y+.68],[x+.3,y+.68]],.06,.07);
  s+=xt(c,'yz',[[y-.55,.06],[y+.55,.06],[y+.42,.2],[y-.42,.2]],x-.2,x+.2,{m:'dark'});
 }
 s+=xt(c,'yz',rr(y-.6,.2,y+.6,.5),x0,x1,{m:'steel'});
 s+=edges(c,[[[x0,y+.6,.27],[x1,y+.6,.27]],[[x0,y+.6,.43],[x1,y+.6,.43]]]);
 const rail=[[-.1,0],[.1,0],[.1,.05],[.06,.08],[.09,.1],[.09,.15],[-.09,.15],[-.09,.1],[-.06,.08],[-.1,.05]];
 for(const ry of[y-.36,y+.36])s+=xt(c,'yz',rail.map(p=>[ry+p[0],.5+p[1]]),x0+.15,x1-.15,{m:'steel'});
 let holes=[];for(let x=x0+.4;x<x1-.2;x+=.6)holes.push([x,y-.36],[x,y+.36]);s+=rings(c,'xy',holes,.65,.035,{n:6});
 // Rack on the front face; teeth as ticks
 s+=xt(c,'yz',rr(y+.6,.29,y+.68,.44),x0+.1,x1-.1,{m:'steel'});
 let d='';for(let x=x0+.16;x<x1-.12;x+=.11){const a=c.P(x,y+.68,.29),b=c.P(x,y+.68,.37);d+=`M${n1(a[0])} ${n1(a[1])}L${n1(b[0])} ${n1(b[1])}`;}
 s+=`<path d="${d}" stroke="${S.ink}" stroke-width=".4" fill="none"/>`;
 for(const xe of[x0,x1-.3]){s+=xt(c,'xy',rr(xe,y-.5,xe+.3,y+.5),.5,.85,{m:'dark'});s+=cyl(c,'x',y-.25,.72,.09,xe<x0+1?xe+.3:xe,xe<x0+1?xe+.45:xe-.15,{},10)+cyl(c,'x',y+.25,.72,.09,xe<x0+1?xe+.3:xe,xe<x0+1?xe+.45:xe-.15,{},10);}
 return s;}
// Cable trough in front of the track, drawn after the carriage.
function trackTrough(c,{x0,x1,y}){const U=[[y+.8,0],[y+1.3,0],[y+1.3,.42],[y+1.26,.42],[y+1.26,.04],[y+.84,.04],[y+.84,.42],[y+.8,.42]];
 return xt(c,'yz',U,x0+.2,x1-.2,{m:'dark'})+edges(c,[[[x0+.2,y+.84,.42],[x1-.2,y+.84,.42]]]);}
// Energy chain: fixed end xf on the trough floor, moving end on the carriage bracket at xc.
function cableChain(c,{xf,xc,xb,y}){const yf=y+1.22,yb=y+.88,z0=.05,h=.12,R=.19,zc=z0+R,P=c.P;
 const lo=[[xf,z0],[xb,z0]],arcO=[],arcI=[];for(let k=0;k<=10;k++){const a=-Math.PI/2+k/10*Math.PI;arcO.push([xb+R*Math.cos(a),zc+R*Math.sin(a)]);arcI.push([xb+(R-h)*Math.cos(a),zc+(R-h)*Math.sin(a)]);}
 const out=lo.concat(arcO,[[xc,zc+R]],[[xc,zc+R-h]],arcI.slice().reverse(),[[xf,z0+h]]);
 let s=`<path d="${pd(out.map(p=>P(p[0],yf,p[1])))}" fill="${S.paper}" stroke="${S.ink}" stroke-width=".9" stroke-linejoin="round"/>`;
 s+=`<path d="${pd([P(xc,yb,zc+R),P(xb,yb,zc+R),P(xb,yf,zc+R),P(xc,yf,zc+R)])}" fill="${S.paper}" stroke="${S.ink}" stroke-width=".6"/>`;
 let d='';const tick=(x,za,zb2,yy)=>{const a=P(x,yy,za),b=P(x,yy,zb2);d+=`M${n1(a[0])} ${n1(a[1])}L${n1(b[0])} ${n1(b[1])}`;};
 for(let x=xf+.22;x<xb;x+=.22)tick(x,z0,z0+h,yf);
 for(let x=xc+.22;x<xb;x+=.22){tick(x,zc+R-h,zc+R,yf);const a=P(x,yb,zc+R),b=P(x,yf,zc+R);d+=`M${n1(a[0])} ${n1(a[1])}L${n1(b[0])} ${n1(b[1])}`;}
 return s+`<path d="${d}" stroke="${S.ink}" stroke-width=".4" fill="none"/>`;}
// Carriage on four bearing blocks, rack drive motor, chain bracket, robot riser.
function trackCarriage(c,{cx,y,mv,riser}){let s='';const o={m:'steel',mv};
 for(const bx of[cx-.62,cx+.62])for(const by of[y-.36,y+.36]){s+=xt(c,'xy',rr(bx-.3,by-.17,bx+.3,by+.17),.56,.76,{m:'dark'});s+=xt(c,'yz',rr(by-.15,.58,by+.15,.74),bx+.3,bx+.34,{m:'dark'});}
 s+=xt(c,'xy',rr(cx-.48,y+.6,cx+.08,y+.9),.3,.76,{m:'dark'});
 s+=xt(c,'xy',rr(cx-1.02,y-.78,cx+1.02,y+.78),.76,.88,o);
 s+=hexes(c,'xy',[[cx-.85,y-.62],[cx+.85,y-.62],[cx-.85,y+.62],[cx+.85,y+.62]],.88,.06);
 s+=xt(c,'yz',[[y+.78,.88],[y+1.08,.88],[y+1.08,.43],[y+1.0,.43],[y+1.0,.82],[y+.78,.82]],cx+.82,cx+1.0,{m:'dark'});
 // Drive motor with cooling rings and connector
 const mx=cx-.2,my=y+.6;s+=cyl(c,'z',mx,my,.17,.88,1.38,o,14);
 s+=edges(c,[1.0,1.1,1.2].map(z=>circ(mx,my,.17,14).slice(0,9).map(p=>[p[0],p[1],z])));
 s+=xt(c,'xy',rr(mx-.07,my+.1,mx+.07,my+.24),1.24,1.36,{m:'dark'});
 if(riser){const h=riser;s+=xt(c,'xy',rr(cx-.48,y-.48,cx+.48,y+.48),.88,.88+h,{m:'steel'});
  s+=xt(c,'xz',[[cx+.48,.88],[cx+.48,.88+h*.6],[cx+.86,.88]],y-.03,y+.03,{m:'dark'});
  s+=xt(c,'yz',[[y+.48,.88],[y+.48,.88+h*.6],[y+.8,.88]],cx+.27,cx+.33,{m:'dark'});
  s+=xt(c,'xy',rr(cx-.7,y-.7,cx+.7,y+.7),.88+h,.98+h,{m:'steel'});}
 return s;}

/* Crane spreader beam: I-section beam, two lifting lugs with a bridle to a hook block and hoist
   ropes (the crane itself stays off the drawing), and webbing slings at each pick point down to
   the load. slings: [{x, top, bot}] where the load's top edge is at z = top and its front face
   runs down to bot; w is the load's half width in y. Back legs draw first, front legs last. */
function spreaderBeam(c,{x0,x1,y=0,z,w,slings,lift=1.3,rope=2.2}){let s='';const P=c.P,xm=(x0+x1)/2,zt=z+.3;
 const L=(pts,wd)=>`<path d="${pd(pts.map(q=>P(...q)),false)}" fill="none" stroke="${S.ink}" stroke-width="${wd}" stroke-linecap="round" stroke-linejoin="round"/>`;
 for(const g of slings)s+=L([[g.x,y,z],[g.x,y-w,g.top]],1.5);
 const I=[[-.16,0],[.16,0],[.16,.05],[.035,.05],[.035,.25],[.16,.25],[.16,.3],[-.16,.3],[-.16,.25],[-.035,.25],[-.035,.05],[-.16,.05]];
 s+=xt(c,'yz',I.map(q=>[y+q[0],z+q[1]]),x0,x1,{m:'steel'});
 for(const xe of[x0,x1])s+=xt(c,'yz',rr(y-.18,z-.02,y+.18,z+.32),xe-.03,xe+.03,{m:'dark'});
 const H=[xm,y,zt+lift],lugs=[x0+(x1-x0)*.28,x1-(x1-x0)*.28];
 for(const xl of lugs){s+=xt(c,'xz',[[xl-.14,zt],[xl+.14,zt],[xl+.07,zt+.22],[xl-.07,zt+.22]],y-.02,y+.02,{m:'dark'});s+=L([[xl,y,zt+.16],H],.9);}
 // Hook block: sheave between side plates, hook below, two hoist ropes leaving upward
 s+=L([H,[xm,y,H[2]+.18]],1.1);
 s+=xt(c,'xz',rr(xm-.24,H[2]+.18,xm+.24,H[2]+.78,.08),y-.13,y+.13,{m:'dark'});
 s+=cyl(c,'y',xm,H[2]+.48,.17,y+.13,y+.17,{m:'steel'},12);
 s+=L([[xm-.15,y,H[2]+.7],[xm-.15,y,H[2]+.78+rope]],.7)+L([[xm+.15,y,H[2]+.7],[xm+.15,y,H[2]+.78+rope]],.7);
 for(const g of slings){s+=cyl(c,'y',g.x,z-.07,.06,y-.03,y+.03,{m:'dark'},8);s+=L([[g.x,y,z-.1],[g.x,y+w,g.top],[g.x,y+w,g.bot]],1.5);}
 return s;}

/* Six-axis industrial arm, KUKA QUANTEC class. All joints lie in the plane x = const of the
   context c. Sh, El, Wr are shoulder (A2), elbow (A3) and wrist (A5) centres as [y,z].
   fd is the flange direction [dy,dz]. tool(ff) draws in the flange frame from z = 0.
   Base sits at [x,y,zb]; the column is fixed for a robot that faces -y. */
// halo: a paper gap of about 2.5 px round the arm's silhouette, so the jacks and yokes it stands
// in front of stop short of its outline instead of tangling with it. The arm is always nearer the
// viewer than the pin row, so it needs a gap, not hidden lines.
function robot6(c,o){const s=robot6Lines(c,o);if(!o.halo)return s;
 return`<defs><filter id="arm-halo" x="-5%" y="-5%" width="110%" height="110%"><feMorphology in="SourceAlpha" operator="dilate" radius="${n1(2.5*Math.max(.6,kk()))}" result="d"/><feFlood flood-color="${S.paper}"/><feComposite in2="d" operator="in"/></filter></defs><use href="#arm" filter="url(#arm-halo)"/><g id="arm">${s}</g>`;}
function robot6Lines(c,{x,y,zb,Sh,El,Wr,fd,tool,mv}){let s='';const P=c.P;
 const st={m:'steel'},dk={m:'dark'};
 // Base frame with fixing bolts, A1 gear housing and slewing ring
 const oct=[[-.72,-.45],[-.45,-.72],[.45,-.72],[.72,-.45],[.72,.45],[.45,.72],[-.45,.72],[-.72,.45]].map(p=>[x+p[0],y+p[1]]);
 s+=xt(c,'xy',oct,zb,zb+.12,dk);
 s+=hexes(c,'xy',[[x-.56,y-.3],[x-.56,y+.3],[x+.56,y-.3],[x+.56,y+.3],[x-.3,y+.56],[x+.3,y+.56]],zb+.12,.055);
 s+=cyl(c,'z',x,y,.56,zb+.12,zb+.5,st,20)+cyl(c,'z',x,y,.6,zb+.5,zb+.58,dk,20);
 // A1 motor at the back of the column
 s+=cyl(c,'z',x-.24,y+.62,.15,zb+.58,zb+1.16,st,12)+xt(c,'xy',rr(x-.3,y+.74,x-.18,y+.86),zb+1.0,zb+1.12,dk);
 // Rotating column, cast, carrying the A2 axis forward of A1
 const z1=zb+.58,col=[[y+.62,z1],[y-.62,z1],[Sh[0]-.45,Sh[1]-.55],[Sh[0]-.35,Sh[1]+.3],[Sh[0]+.2,Sh[1]+.56],[y+.5,Sh[1]+.1]];
 s+=xt(c,'yz',col,x-.46,x+.46,st);
 s+=edges(c,[[[x+.46,y+.45,z1+.12],[x+.46,Sh[0]-.3,Sh[1]-.45]]]);
 // Lower arm with recessed panel and hub bolt circle
 const len=Math.hypot(El[0]-Sh[0],El[1]-Sh[1]);
 s+=xt(c,'yz',cap2(Sh,El,.46,.34),x-.32,x+.32,{m:'steel',mv});

   pixels from the anchor to the elbow, so the box can be steered into the free area.
   o.at (a world point) pins the elbow in place, so a label on a moving part keeps its box still

   Text is always horizontal: no label, tag or dimension text is ever rotated (dimLine follows). */

  const bx=p[0]+dx,by=p[1]+dy,sd=o.side||(dx<0?-1:1),col=S.ink;
  const L=Math.hypot(dx,dy),ux=-dx/L,uy=-dy/L,ah=5*k; // arrowhead at anchor

// length at full hold, from every neighbour, the machine it left and the other parts. A near miss

function explodedView(c,t,{start=0,open=1,hold=4,close=1,components,assembled}){

const face=(c,pts,o)=>{o=o||{};return`<path d="${pd(pts.map(p=>c.P(...p)))}" fill="${o.fill||S.paper}" stroke="${o.col||S.ink}" stroke-width="${o.w||1}" stroke-linejoin="round"/>`;};
// 45 degree hatch over a projected polygon, clipped to it: the mark of a cut face.

 for(let u=x0-h;u<x1;u+=st)d+=`M${n1(u)} ${n1(y1)}L${n1(u+h)} ${n1(y0)}`;

/* ---- trestle: steel A-frames with feet, gussets and height holes, a beam and a rubber pad ---- */

  let e='';for(let j=1;j<NL;j++){const a=P(xb,ye-HW+j*TL,RT+dz),b=P(xb,ye-HW+j*TL,RB+dz);e+=`M${n1(a[0])} ${n1(a[1])}L${n1(b[0])} ${n1(b[1])}`;}

// Grain runs along each member; glue lines show the lamellae through the depth.
function grainLines(c,pts,along){const a=pts[0],b=pts[2];let d='';for(let k=1;k<4;k++){const f=k/4,l=[];
  for(let i=0;i<=10;i++){const u=i/10,w=.04*Math.sin(u*7+k*2);const p=[0,1,2].map(j=>lerp(a[j],b[j],j===along?u:f)+(j!==along&&a[j]!==b[j]?w:0));l.push(p);}d+=pd(l.map(p=>c.P(...p)),false);}
 return`<path d="${d}" fill="none" stroke="${MAT.grain}" stroke-width=".5"/>`;}
function jointA(c){return prism(c,'y',JA,-JT/2,JT/2,{cut:(p,r)=>p[0]===r[0]||(p[1]===JD/2&&r[1]===JD/2),
 grain:pts=>grainLines(c,pts,0),
 capLines:y=>{let d=[];for(let j=1;j<NL;j++){const z=j*JD/NL;if(z<JD/2)d.push([[-JL,y,z],[JL,y,z]]);else d.push([[-JL,y,z],[-JW,y,z]],[[JW,y,z],[JL,y,z]]);}
  let s=edges(c,d,{w:.4});if(MAT){const g=[];for(let k=0;k<6;k++){const z=(k+.5)*JD/6,x0=k%2?-JL+.2:JW+.15;if(z>JD/2&&k%2)continue;g.push(Array.from({length:9},(_,i)=>[x0+i*.22,y,z+.03*Math.sin(i+k)]));}s+=edges(c,g,{col:MAT.grain,w:.5});}return s;}});}
function jointB(c,poly){return prism(c,'x',poly||JBP,-JT/2,JT/2,{cut:(p,r)=>p[0]===r[0]||(p[1]===JD/2&&r[1]===JD/2),
 grain:pts=>grainLines(c,pts,1),
 capLines:x=>{let d=[];for(let j=1;j<NL;j++){const z=j*JD/NL;if(z>JD/2)d.push([[x,-JB,z],[x,JB,z]]);else d.push([[x,-JB,z],[x,-JW,z]],[[x,JW,z],[x,JB,z]]);}return edges(c,d,{w:.4});}});}
function detail(t){const ex=exAmt(t);if(ex<.01)return'';const c=detC(),lift=JLIFT*ex;
 const cb={P:(x,y,z)=>c.P(x,y,z+lift)};let s='';MAT=MOMENT;
 // While the parts still overlap in height, the crossing rib's far leg lies behind this rib.
 const split=lift<JD+.05;
 if(split)s+=jointB(cb,[[-JB,0],[-JW,0],[-JW,JD],[-JB,JD]]);
 s+=jointA(c);
 s+=explodeAxis(c,[0,0,JD/2],[0,0,JD/2+lift],{w:.6,op:.9});
 for(const[x,y]of[[-JW,JT/2],[JW,-JT/2]])s+=explodeAxis(c,[x,y,JD],[x,y,lift],{w:.5,op:.7});
 s+=jointB(cb,split?[[-JW,JD/2],[JW,JD/2],[JW,0],[JB,0],[JB,JD],[-JW,JD]]:JBP);
 MAT=null;
 return`<g opacity="${n1(seg(ex,0,.2))}">${s}</g>`;}
function detailLabels(t){const la=seg(t,EX0+EXO+.15,EX0+EXO+.4)*(1-seg(t,EX0+EXO+EXH-.05,EX0+EXO+EXH+.15));if(la<.02)return'';
 const c=detC(),cb={P:(x,y,z)=>c.P(x,y,z+JLIFT)};let s='';
 s+=lead(c,[0,JT/2,JD/2],30,120,'this rib: notch to half its depth',la,{id:'x-a',side:1});
 s+=tag(cb,[JT/2,-JB-.25,JD*.75+.25],1,0,'crossing rib: notch from below',la,{id:'x-b',tick:1});
 s+=dimLine(c,[-JL,JT/2,0],[-JL,JT/2,JD],[-1.2,0,0],'200 mm',la,{});
 return s;}
// Detail circle round the real notch while the exploded detail is open.
function detailRing(c,t){const ex=exAmt(t);if(ex<.01)return'';
 const p=c.P(XN,YN+HW/2,RT-.3),r=24*kk(),q=detC().P(0,0,JD/2);const d=Math.hypot(q[0]-p[0],q[1]-p[1]),u=[(q[0]-p[0])/d,(q[1]-p[1])/d];
 return`<g opacity="${n1(seg(ex,0,.3))}"><circle cx="${n1(p[0])}" cy="${n1(p[1])}" r="${n1(r)}" fill="none" stroke="${S.ink}" stroke-width=".6"/><path d="M${n1(p[0]+u[0]*r)} ${n1(p[1]+u[1]*r)}L${n1(q[0]-u[0]*70*kk())} ${n1(q[1]-u[1]*70*kk())}" stroke="${S.ink}" stroke-width=".5" stroke-dasharray="10 3 2 3" fill="none"/></g>`;}

/* ---- crane spreader for the lay down ---- */
const SLX=(()=>{const a=3.4,y=Yt(a);let lo=9,hi=15;for(let k=0;k<40;k++){const m=(lo+hi)/2;if(Yt(m)<y)lo=m;else hi=m;}return[a,(lo+hi)/2];})();
function layingSpreader(c,t){const a=seg(t,0,.5)*(1-seg(t,3.4,3.9));if(a<.01)return'';
 const dz=t<LAND1+.2?ribDrop(t):LH*sst(seg(t,LAND1+.2,3.9)),held=t<LAND1+.2;
 const slings=held?SLX.map(x=>({x,top:RT+dz,bot:RB+dz})):[];
 return`<g opacity="${n1(a)}">${spreaderBeam(c,{x0:1.8,x1:14.2,y:Yt(SLX[0]),z:RT+1.0+dz,w:HW,slings})}</g>`;}

/* ---- scene ---- */
const MOMENT={steel:'#e8ecee',wood:'#fbf6ec',grain:'#a2845a'};
function drawScene(c,t,flags){let s='';CLIP=0;const rp=robotPose(t),ra=seamA(t,flags),d=cutDepth(t);
 s+=memo('floor',()=>S.floor(c));
 s+=memo('tback',()=>TX.map(x=>trestleBack(c,x)).join(''));
 if(ra>.005){const dz=ribDrop(t),mv=t>LAND0&&t<LAND1,xp=t<CV0?XO1:t<CV1?carveX(t):XO0;
  s+=`<g opacity="${n1(ra)}">${memo(`rib|${dz.toFixed(3)}|${mv}`,()=>ribSeg(c,0,RL,{dz,mv,start:1,end:1}))}${memo('notch|'+d.toFixed(4),()=>notch(c,d))}${memo('orn|'+xp.toFixed(3),()=>ornament(c,xp))}</g>`;}
 s+=memo('tfront',()=>TX.map(x=>trestleFront(c,x)).join(''));
 s+=layingSpreader(c,t);
 s+=memo('rack|'+toolOn(t),()=>rack(c,t));
 s+=memo('track',()=>trackBase(c,{x0:-3.6,x1:17.9,y:TRY}));
 const El=elbowUp([SHY,SHZ],rp.W,L1,L2),tool=toolOn(t);
 s+=trackCarriage(c,{cx:rp.cx,y:TRY,riser:RISER});
 s+=robot6(c,{x:rp.cx,y:TRY,zb:RZB,Sh:[SHY,SHZ],El,Wr:rp.W,fd:rp.fd,halo:true,tool:f=>spindle(f,{tool,mv:rp.cut||rp.carve})});
 if(rp.cut&&ra>.005)s+=nearCover(c,d);
 s+=memo('trough',()=>trackTrough(c,{x0:-3.6,x1:17.9,y:TRY}));
 s+=cableChain(c,{xf:-3.1,xc:rp.cx+1.0,xb:(rp.cx-3.1)/2+10.3,y:TRY});
 return s;}

/* ===== Style B: drafted ===== */
S.hiddenLines=true;S.bower='#2a6a50';
S.ink='#22262a';S.dim='#9aa0a6';S.hid='#80868c';S.acc='#b4492f';S.paper='#fdfcf9';S.mut='#6b7178';
S.solid=(h,cap,o)=>{const f=MAT?MAT.steel:S.paper;return`<path d="${pd(h)}" fill="${f}" stroke="${o.mv?S.acc:S.ink}" stroke-width="${o.mv?1.5:1.25}" stroke-linejoin="round"/><path d="${pd(cap)}" fill="none" stroke="${S.ink}" stroke-width=".5" stroke-linejoin="round"/>`;};
S.floor=c=>{const P=c.P;let s='';const r=[P(-4.2,-4.4,0),P(18.4,-4.4,0),P(18.4,7.8,0),P(-4.2,7.8,0)];
 s+=`<path d="${pd(r)}" fill="none" stroke="${S.dim}" stroke-width=".5"/>`;
 let d='';for(let x=-2;x<=18;x+=2){const a=P(x,7.8,0),b=P(x,7.5,0);d+=`M${n1(a[0])} ${n1(a[1])}L${n1(b[0])} ${n1(b[1])}`;}
 s+=`<path d="${d}" stroke="${S.dim}" stroke-width=".5"/>`;
 const cl=[P(-4.2,TRY,0),P(18.4,TRY,0)];s+=`<path d="${pd(cl,false)}" stroke="${S.dim}" stroke-width=".5" stroke-dasharray="14 3 2 3" fill="none"/>`;
 return s;};

/* ---- overlay: joint schedule, toolpath, chips, face scan, ornament band, labels ---- */
const sp=(pts,col,w,dash,op)=>`<path d="${pd(pts,false)}" fill="none" stroke="${col}" stroke-width="${w}" ${dash?`stroke-dasharray="${dash}"`:''} stroke-linecap="round" stroke-linejoin="round" ${op!=null?`opacity="${n1(op)}"`:''}/>`;
const win=(t,a,b,r=.5)=>seg(t,a,a+r)*(1-seg(t,b-r,b));
// The engine's joint schedule as a flat sheet; one row travels to its crossing on the rib.
const SH0=5.1,SH1=17.6;
function scheduleSheet(c,t){const a=win(t,SH0,SH1,.3);if(a<.01)return'';
 const at=VB?c.P(2,-2,7):null,k=kk();if(!at)return'';const[x,y]=at,w=58*k,h=70*k,f=9*k;let s='';
 s+=`<g opacity="${n1(a)}"><path d="M${n1(x)} ${n1(y)}H${n1(x+w-f)}L${n1(x+w)} ${n1(y+f)}V${n1(y+h)}H${n1(x)}Z" fill="${S.paper}" stroke="${S.ink}" stroke-width=".9"/>`;
 s+=`<path d="M${n1(x+w-f)} ${n1(y)}V${n1(y+f)}H${n1(x+w)}" fill="none" stroke="${S.ink}" stroke-width=".5"/>`;
 s+=`<path d="M${n1(x+6*k)} ${n1(y+10*k)}H${n1(x+30*k)}" stroke="${S.ink}" stroke-width="1.6"/>`;
 for(let i=0;i<5;i++){const yy=y+(22+i*10)*k,on=i===0;
  s+=`<path d="M${n1(x+6*k)} ${n1(yy)}H${n1(x+14*k)}M${n1(x+18*k)} ${n1(yy)}H${n1(x+w-6*k)}" stroke="${S.ink}" stroke-width="${on?1.3:.5}"/>`;}
 const tie=c.P(robotPose(t).cx,TRY,RZB);
 s+=`<path d="M${n1(x+w/2)} ${n1(y+h)}L${n1(tie[0])} ${n1(tie[1])}" fill="none" stroke="${S.ink}" stroke-width=".5" stroke-dasharray="2 2"/></g>`;
 const k2=ease(seg(t,5.6,6.6));if(k2>0&&k2<1){const p=[x+w/2,y+22*k],q=c.P(XN,YN+HW/2,RT),m=[lerp(p[0],q[0],k2),lerp(p[1],q[1],k2)],r=2.2;
  s+=`<path d="M${n1(m[0]-r)} ${n1(m[1]-r)}h${2*r}v${2*r}h${-2*r}Z" fill="${S.acc}"/><path d="M${n1(p[0])} ${n1(p[1])}L${n1(m[0])} ${n1(m[1])}" stroke="${S.acc}" stroke-width=".5" stroke-dasharray="2 2" fill="none"/>`;}
 s+=tag(HUD,[x+w,y+h/2],12,0,'joint schedule',win(t,SH0+.1,SH1,.25),{id:'schedule'});
 return s;}
// The toolpath from the schedule: notch outline and the four passes, dashed, until they are cut.
function toolpath(c,t){const a=win(t,6.4,CUT1+.2,.4);if(a<.01)return'';const P=c.P,d=cutDepth(t);let s='';
 const box=[[X0,YN,RT],[X1,YN,RT],[X1,YF,RT],[X1,YF,RB],[X0,YF,RB],[X0,YF,RT],[X0,YN,RT]];
 s+=sp(box.map(p=>P(...p)),S.ink,.75,'5 3',a);
 const zz=[];for(let i=0;i<4;i++){const y=YF-(i+1)*HW/4+TR;if(YF-y<d+.05)continue;const xs=i%2?[XB,XA]:[XA,XB];zz.push(P(xs[0],y,RT),P(xs[1],y,RT));}
 if(zz.length>1)s+=sp(zz,S.ink,.6,'2 2',a);
 return s;}
// Chips leave the cutter while it works: short ink strokes thrown forward and up, then falling.
function chips(c,t,rp,tool){if(!(rp.cut||rp.carve))return'';const tp=tipAt(rp,tool),P=c.P;let d='';const n=rp.cut?18:10;
 for(let i=0;i<n;i++){const ph=((t*1.7+i/n)%1),tau=ph*.55,ang=i*2.39;
  const v=[.9*Math.cos(ang),1.4+.6*Math.sin(ang*1.7),1.6+.8*Math.sin(i*1.3)];
  const p=[tp[0]+v[0]*tau,tp[1]+v[1]*tau,tp[2]+(rp.cut?.5:0)+v[2]*tau-4.5*tau*tau],q=[p[0]+.06*Math.cos(ang),p[1]+.05,p[2]+.04];
  const a=P(...p),b=P(...q);d+=`M${n1(a[0])} ${n1(a[1])}L${n1(b[0])} ${n1(b[1])}`;}
 return`<path d="${d}" stroke="${S.ink}" stroke-width="1.1" stroke-linecap="round" fill="none"/>`;}
// Cut faces for the scan: u across the notch, v down the back wall then across the cheek.
const VW=.62;
const facePt=(u,v,real)=>{if(v<VW){const f=v/VW;return[lerp(X0,X1,u),YN+(real?LEAN*f:0),lerp(RT,RB,f)];}
 const f=(v-VW)/(1-VW);return[X0,lerp(YN+(real?LEAN*f:0),YF,u),lerp(RT,RB,f)];};
// The target notch faces, dashed (targetOutline grammar), drawn over the fills and the points.
// The lines the real cut leaves (the wall foot, the wall's two upright edges, the cheek foot) get
// a paper halo with o.halo, so the dashes read across the point cloud and off the solid edges.
const TGT=[[[X0,YN,RT],[X1,YN,RT]],[[X0,YN,RB],[X1,YN,RB]],[[X0,YN,RT],[X0,YN,RB]],[[X1,YN,RT],[X1,YN,RB]],[[X0,YN,RB],[X0,YF,RB]]];
function targetNotch(c,a,o){if(a<.01)return'';o=o||{};const tg=(u,e)=>TGT[e][0].map((v,i)=>lerp(v,TGT[e][1][i],u));let s='';
 if(o.halo){const d=[1,2,3,4].map(e=>pd([tg(0,e),tg(e===4?LEAN/HW:1,e)].map(p=>c.P(...p)),false)).join('');
  s+=`<path d="${d}" fill="none" stroke="${S.paper}" stroke-width="${o.halo}" stroke-linecap="round" opacity="${n1(a)}"/>`;}
 return s+targetOutline(c,{target:tg,edges:[0,1,2,3,4],n:12,alpha:a});}
function faceScan(c,t){if(t<SW0-.1||t>CMPE)return'';const P=c.P,a=1-seg(t,CMPE-.4,CMPE);let s='';
 const prog=seg(t,SW0,SW1),cmp=ease(seg(t,CMP0,CMP0+.5));
 const cl=scanCloud(c,{surface:(u,v)=>facePt(u,v,true),target:(u,v)=>facePt(u,v,false),progress:prog,count:420,noise:.02,compare:cmp,tolerance:.15,r:.7});
 s+=`<g opacity="${n1(a)}">${cl}</g>`+targetNotch(c,cmp*a);
 if(t>SW0&&t<SW1){const rp=robotPose(t),ff=alongC(c,[rp.cx,rp.W[0],rp.W[1]],[0,rp.fd[0],rp.fd[1]]),f=frameC(ff,[0,0,.36],[1,0,0],[0,1,0],[0,0,1]);
  const em=f.P(...SENS),x=clamp(lerp(X0,X1,prog),X0,X1);
  const stripe=[P(x,YN-HW,RT),P(x,YN,RT),P(x,YN+LEAN,RB)];
  s+=`<path d="M${n1(em[0])} ${n1(em[1])}L${n1(stripe[0][0])} ${n1(stripe[0][1])}M${n1(em[0])} ${n1(em[1])}L${n1(stripe[2][0])} ${n1(stripe[2][1])}" stroke="${S.acc}" stroke-width=".75" fill="none"/>`;
  s+=sp(stripe,S.acc,1.6);}
 if(cmp>.01)for(const u of[.25,.75]){const x=lerp(X0,X1,u);s+=sp([P(x,YN,RB),P(x,YN+LEAN,RB)],S.acc,1.4,null,cmp*a);}
 return s;}
// Reserved carving depth: a dashed line on the front face below the ornament band.
function reserve(c,t){const a=win(t,25.0,33.5,.4);if(a<.01)return'';const l=[];for(let x=XO0-.2;x<=XO1+.21;x+=.1)l.push(c.P(x,Yt(x)+HW,RT-ORES));
 return sp(l,S.ink,.75,'5 3',a);}
// The face scan, magnified three times in a detail bubble in free paper, held through the
// comparison. The bubble repeats the rib, the cut, the points and the target at a larger scale.
const MAGK=3,MAGR=150;
const magAt=()=>detC().P(.4,0,2.1);
const magC=()=>{const m=magAt(),o=mainC.P(XN,YN+HW/2,(RT+RB)/2);return{P:(x,y,z)=>{const p=mainC.P(x,y,z);return[m[0]+(p[0]-o[0])*MAGK,m[1]+(p[1]-o[1])*MAGK];}};};
const magA=t=>win(t,SW0-.4,CMPE,.4);
function magBubble(t){const a=magA(t);if(a<.01||!VB)return''; // not measured by fit(): it sits inside the drawing
 const m=magAt(),c3=magC(),r=MAGR*kk()/1.2,P=c3.P;let s='';
 s+=`<circle cx="${n1(m[0])}" cy="${n1(m[1])}" r="${n1(r)}" fill="${S.paper}" stroke="${S.ink}" stroke-width=".9"/>`;
 let inner=ribSeg(c3,XN-4,X1,{})+notch(c3,HW);
 const prog=seg(t,SW0,SW1),cmp=ease(seg(t,CMP0,CMP0+.5));
 inner+=scanCloud(c3,{surface:(u,v)=>facePt(u,v,true),target:(u,v)=>facePt(u,v,false),progress:prog,count:420,noise:.02,compare:cmp,tolerance:.15,r:1.1});
 inner+=targetNotch(c3,cmp,{halo:3});
 if(t>SW0&&t<SW1){const x=clamp(lerp(X0,X1,prog),X0,X1),stripe=[P(x,YN-HW,RT),P(x,YN,RT),P(x,YN+LEAN,RB)],em=P(x+.3,YN+.45,RT+2.4);
  inner+=`<path d="M${n1(em[0])} ${n1(em[1])}L${n1(stripe[0][0])} ${n1(stripe[0][1])}M${n1(em[0])} ${n1(em[1])}L${n1(stripe[2][0])} ${n1(stripe[2][1])}" stroke="${S.acc}" stroke-width=".75" fill="none"/>`+sp(stripe,S.acc,2);}
 if(cmp>.01)for(const u of[.25,.75]){const x=lerp(X0,X1,u),g=[P(x,YN,RB),P(x,YN+LEAN,RB)];inner+=sp(g,S.paper,4.5,null,cmp)+sp(g,S.acc,2,null,cmp);}
 const id='mag'+(CLIP++);
 s+=`<clipPath id="${id}"><circle cx="${n1(m[0])}" cy="${n1(m[1])}" r="${n1(r-1)}"/></clipPath><g clip-path="url(#${id})">${inner}</g>`;
 // Ring on the real notch and a dash-dot line to the bubble
 const p=mainC.P(XN,YN+HW/2,RT-.3),rr0=24*kk(),d=Math.hypot(m[0]-p[0],m[1]-p[1]),u=[(m[0]-p[0])/d,(m[1]-p[1])/d];
 s+=`<circle cx="${n1(p[0])}" cy="${n1(p[1])}" r="${n1(rr0)}" fill="none" stroke="${S.ink}" stroke-width=".6"/><path d="M${n1(p[0]+u[0]*rr0)} ${n1(p[1]+u[1]*rr0)}L${n1(m[0]-u[0]*r)} ${n1(m[1]-u[1]*r)}" stroke="${S.ink}" stroke-width=".5" stroke-dasharray="10 3 2 3" fill="none"/>`;
 return`<g opacity="${n1(a)}">${s}</g>`;}
// The ornament, magnified three times in a bubble above it, while the ball nose carves.
const ORX=11.6,ornAt=()=>mainC.P(ORX+1.3,Yt(ORX),RT+7.4);
const ornC=()=>{const m=ornAt(),o=mainC.P(ORX,Yt(ORX),RT);return{P:(x,y,z)=>{const p=mainC.P(x,y,z);return[m[0]+(p[0]-o[0])*MAGK,m[1]+(p[1]-o[1])*MAGK];}};};
const ornA=t=>win(t,25.7,33.5,.4);
function ornBubble(t){const a=ornA(t);if(a<.01||!VB)return'';const m=ornAt(),c3=ornC(),r=MAGR*kk()/1.2;let s='';
 const xp=t<CV0?XO1:t<CV1?carveX(t):XO0;
 let inner=ribSeg(c3,ORX-4,ORX+4,{})+ornament(c3,xp,1.8);
 const l=[];for(let x=ORX-4;x<=ORX+4;x+=.1)l.push(c3.P(x,Yt(x)+HW,RT-ORES));inner+=sp(l,S.ink,1,'6 4');
 if(t>CV0-.3&&t<CV1+.3){const y=stemY(xp),f=frameC(c3,[xp,y,RT-.04+TIP.ball],[1,0,0],[0,-1,0],[0,0,-1]);inner+=holder(f,false)+cutter(f,'ball',{mv:t>=CV0&&t<CV1});}
 const id='orn'+(CLIP++);
 s+=`<circle cx="${n1(m[0])}" cy="${n1(m[1])}" r="${n1(r)}" fill="${S.paper}" stroke="${S.ink}" stroke-width=".9"/><clipPath id="${id}"><circle cx="${n1(m[0])}" cy="${n1(m[1])}" r="${n1(r-1)}"/></clipPath><g clip-path="url(#${id})">${inner}</g>`;
 const p=mainC.P(ORX,Yt(ORX),RT),rr0=26*kk(),d=Math.hypot(m[0]-p[0],m[1]-p[1]),u=[(m[0]-p[0])/d,(m[1]-p[1])/d];
 s+=`<circle cx="${n1(p[0])}" cy="${n1(p[1])}" r="${n1(rr0)}" fill="none" stroke="${S.ink}" stroke-width=".6"/><path d="M${n1(p[0]+u[0]*rr0)} ${n1(p[1]+u[1]*rr0)}L${n1(m[0]-u[0]*r)} ${n1(m[1]-u[1]*r)}" stroke="${S.ink}" stroke-width=".5" stroke-dasharray="10 3 2 3" fill="none"/>`;
 return`<g opacity="${n1(a)}">${s}</g>`;}
S.overlay=(c,t,fl)=>{const rp=robotPose(t),tool=toolOn(t),w=(a,b)=>win(t,a,b,.25);
 let s=scheduleSheet(c,t)+toolpath(c,t)+chips(c,t,rp,tool)+detailRing(c,t)+detail(t)+faceScan(c,t)+magBubble(t)+reserve(c,t)+ornBubble(t)+detailLabels(t);
 // Lay down
 s+=lead(c,[RL/2,Yt(SLX[0]),RT+1.3+ribDrop(t)],60,-40,'crane spreader beam and slings',w(.5,4.7),{id:'crane',at:[3.2,-5,9.2],side:-1});
 s+=lead(c,[TX[4]+.5,Yt(TX[4])+1.3,.8],-40,60,'steel trestles beside the robot rail',w(1.0,5.0),{id:'trestles'});
 s+=dimLine(c,[0,-HW,RT],[RL,-HW,RT],[0,-3.4,0],'22 m rib',w(3.8,8.0),{});
 // Travel: schedule to toolpath, tool change
 s+=lead(c,[X1,YF,RT],30,-90,'joint schedule from the engine becomes the toolpath',w(6.6,10.6),{id:'path',bower:1});
 s+=lead(c,[HOME+.1,YS+.4,RKZ-1.2],70,150,'tool rack: end mill, saw blade, ball nose',w(5.2,9.2),{id:'rack'});
 // Cut
 s+=lead(c,[rp.cx+.24,rp.W[0],rp.W[1]-.36-.5],0,0,'HSD ES929 class spindle, 9 kW, automatic tool change',w(10.7,15.2),{id:'spindle',at:[XN-1,YN-2,9.8],side:1});
 // Check the fit
 s+=lead(magC(),[X1-.15,YN+.05,RT-.15],150,-70,'fit checked by scanning the cut faces',w(18.3,24.4),{id:'fit',bower:1});
 s+=lead(magC(),[lerp(X0,X1,.8),YN+LEAN*.8,lerp(RT,RB,.8)],150,45,'schematic gap: fit limit still to be tested',w(21.3,25.4),{id:'gap',acc:1});
 // Ornament
 s+=lead(ornC(),[ORX+.45,stemY(ORX+.45),RT],-170,-75,'ornament in structural timber, a proposal',w(27.4,33.4),{id:'orn',bower:1,side:-1});

const STEPS=[
 ["Lay down","The crane lays the rib beside the robot rail."],
 ["Travel","The robot takes an end mill to the first joint."],
 ["Cut","The spindle mills a half-lap to half the rib's depth."],
 ["Check","A laser scan checks the cut against the target."],
 ["Ornament","A ball nose carves within the reserved depth."]];
const mainC={P:mkP(0,0,30)};

/* ---- page plumbing ---- */
const $=id=>document.getElementById(id);
const svg=$('s'),root=$('g');
let VB=null;
// Loop seam: only transient parts fade, over 0.5 s at each end. The shop (bed, pins, yokes,
// track, robot) stays at full strength. Overlays always fade; a station wraps its own transient
// geometry (the rib) in seamA(t, flags) inside drawScene.
const seamA=(t,flags)=>flags&&flags.static?1:Math.min(seg(t,0,.5),1-seg(t,DUR-.5,DUR));
function frame(t,flags){
  const started=performance.now();flags=flags||{};
  const a=seamA(t,flags);
  let inner=drawScene(mainC,t,flags);
  const over=S.overlay?S.overlay(mainC,t,flags):'';
  if(over&&a>.005)inner+=`<g opacity="${n1(a)}">${over}</g>`;
  root.innerHTML=inner;
  collectAnnotations();window.__frameMS=performance.now()-started;
}
// Fit the viewBox tightly to the drawing over FIT_TIMES. The svg fills the stage and scales
// with "meet", centred, so the machine is as large as the free stage allows.
function fit(){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  // Geometry only: labels are placed inside the fitted area, so they must not widen it.
  for(const t of FIT_TIMES){root.innerHTML=drawScene(mainC,t,{})+(S.overlay?S.overlay(mainC,t,{}):'');for(const e of root.querySelectorAll('[data-label],[data-dimension]'))e.style.display='none';const b=root.getBBox();x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.width);y1=Math.max(y1,b.y+b.height);}
  const pad=24;VB=[x0-pad,y0-pad,x1-x0+2*pad,y1-y0+2*pad];svg.setAttribute('viewBox',VB.map(n1).join(' '));
  // A constant whole-drawing lift balances the main machine when exploded details leave.
  // Keep each station's scale fixed across every step. Offsets are viewBox fractions.
  const station=DRAWING_META.number;
  const lift=0;
  root.setAttribute('transform',`translate(0 ${n1(-VB[3]*lift)})`);
  svg.setAttribute('preserveAspectRatio','xMidYMid meet');
}


const factoryMedia = matchMedia('(prefers-reduced-motion: reduce)');
let factoryActive=false, factoryIntent=true, factoryRaf=0, factoryLast=0, factoryEmit=0;
let factoryTime=typeof VIEWPORT_T!=='undefined'?VIEWPORT_T:STATIC_T;
let factoryStatic=factoryMedia.matches;
let factoryDraws=0;
const factoryReady = () => window.__ready===true;
function factoryState(){
  const index=typeof stepOf==='function'?stepOf(factoryTime):0;
  const item=typeof STEPS!=='undefined'?STEPS[index]:null;
  return {id:DRAWING_META.id,title:DRAWING_META.title,duration:DUR,time:factoryTime,
    playing:!!factoryRaf,active:factoryActive,reducedMotion:factoryMedia.matches,
    step:item?item[0]:'Process overview',caption:item?item[1]:DRAWING_META.whatHappens,
    stepIndex:index,static:factoryStatic,ready:factoryReady(),renderCount:factoryDraws};
}
function factoryNotify(){
  const state=factoryState();
  window.dispatchEvent(new CustomEvent('bower:factory-state',{detail:state}));
  if(parent!==window)parent.postMessage({type:'bower-factory:state',state},'*');
}
function factoryRender(){frame(factoryTime,{static:factoryStatic});factoryDraws++;}
function factoryFit(){
  // Some scenes place insets after the initial viewBox is known. Reconcile their
  // full timeline with the compact deck viewport, retaining one stable camera.
  VB=null;root.removeAttribute('transform');fit();
  if(DRAWING_META.id==='overview')return;
  const times=[...new Set([...FIT_TIMES,...(typeof REVIEW_TIMES!=='undefined'?REVIEW_TIMES:[]),STATIC_T])];
  for(let pass=0;pass<8;pass++){
    let x0=VB[0],y0=VB[1],x1=x0+VB[2],y1=y0+VB[3];
    const pad=8*Math.max(VB[2]/Math.max(1,svg.clientWidth),VB[3]/Math.max(1,svg.clientHeight));
    for(const value of times){
      frame(value,{});
      // SVG getBBox includes geometry outside clip paths. The visible inset
      // outlines already bound those details; invisible shearing tools must
      // not enlarge the camera by several metres as they leave the inset.
      for(const clipped of root.querySelectorAll('[clip-path]'))clipped.style.display='none';
      const b=root.getBBox();
      x0=Math.min(x0,b.x-pad);y0=Math.min(y0,b.y-pad);
      x1=Math.max(x1,b.x+b.width+pad);y1=Math.max(y1,b.y+b.height+pad);
    }
    if(Math.abs(x0-VB[0])+Math.abs(y0-VB[1])+Math.abs(x1-VB[0]-VB[2])+Math.abs(y1-VB[1]-VB[3])<.5)break;
    VB=[x0,y0,x1-x0,y1-y0];svg.setAttribute('viewBox',VB.map(n1).join(' '));
  }
}
function factoryStop(){
  if(factoryRaf)cancelAnimationFrame(factoryRaf);
  factoryRaf=0;factoryLast=0;
}
function factoryTick(now){
  factoryRaf=0;
  if(!factoryActive||!factoryIntent||document.hidden||factoryMedia.matches)return;
  if(factoryLast)factoryTime=(factoryTime+(now-factoryLast)/1000)%DUR;
  factoryLast=now;factoryStatic=false;factoryRender();
  factoryRaf=requestAnimationFrame(factoryTick);
  if(now-factoryEmit>120){factoryEmit=now;factoryNotify();}
}
function factoryStart(){
  if(factoryReady()&&factoryActive&&factoryIntent&&!document.hidden&&!factoryMedia.matches&&!factoryRaf){
    factoryLast=0;factoryRaf=requestAnimationFrame(factoryTick);
  }
}
function factorySeek(value){
  const parsed=Number(value);if(!Number.isFinite(parsed))return factoryState();
  factoryStop();factoryIntent=false;factoryStatic=false;
  factoryTime=Math.max(0,Math.min(DUR,parsed));
  if(factoryReady())factoryRender();factoryNotify();return factoryState();
}
window.__ready=false;
window.__duration=DUR;
window.__reviewTimes=typeof REVIEW_TIMES!=='undefined'?REVIEW_TIMES:null;
window.__viewportT=typeof VIEWPORT_T!=='undefined'?VIEWPORT_T:null;
window.__setT=factorySeek;
window.BOWER_FACTORY=Object.freeze({
  setActive(value){factoryActive=!!value;if(factoryActive)factoryStart();else factoryStop();factoryNotify();return factoryState();},
  play(){factoryIntent=true;factoryStatic=false;factoryStart();factoryNotify();return factoryState();},
  pause(){factoryIntent=false;factoryStop();factoryNotify();return factoryState();},
  seek:factorySeek,
  renderStatic(){factoryIntent=false;factoryStop();factoryStatic=true;factoryTime=STATIC_T;
    if(factoryReady())factoryRender();factoryNotify();return factoryState();},
  getState:factoryState,
  exportSvg(){
    const copy=svg.cloneNode(true);copy.setAttribute('xmlns','http://www.w3.org/2000/svg');
    copy.setAttribute('width',svg.clientWidth);copy.setAttribute('height',svg.clientHeight);
    copy.setAttribute('style','background:#fdfcf9;color:#23272b');
    return new XMLSerializer().serializeToString(copy);
  }
});
// The file:// preview has opaque origins. Only its actual parent may issue the small
// public drawing API; no arbitrary code, URLs, storage or DOM commands are accepted.
window.addEventListener('message',async event=>{
  if(event.source!==parent||parent===window||event.data?.type!=='bower-factory:command')return;
  const {requestId,action,args}=event.data;
  const allowed={state:'getState',getState:'getState',setActive:'setActive',play:'play',pause:'pause',seek:'seek',renderStatic:'renderStatic',exportSvg:'exportSvg'};
  const method=Object.hasOwn(allowed,action)?allowed[action]:null;
  if(!method)return;
  try{
    await window.BOWER_FACTORY_READY;
    const result=window.BOWER_FACTORY[method](...(Array.isArray(args)?args:[]));
    parent.postMessage({type:'bower-factory:reply',requestId,result},'*');
  }catch(error){parent.postMessage({type:'bower-factory:reply',requestId,error:String(error?.message||error)},'*');}
});
window.addEventListener('keydown',event=>{
  if(event.key==='Escape'&&parent!==window)parent.postMessage({type:'bower-factory:escape'},'*');
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)factoryStop();else factoryStart();factoryNotify();});
factoryMedia.addEventListener('change',()=>{
  factoryStop();factoryStatic=factoryMedia.matches;
  if(factoryStatic){factoryTime=STATIC_T;if(factoryReady())factoryRender();}
  else factoryStart();factoryNotify();
});
let factoryWidth=0,factoryHeight=0;
const factoryResize=new ResizeObserver(()=>{
  if(!factoryReady()||!svg.clientWidth||!svg.clientHeight)return;
  if(svg.clientWidth===factoryWidth&&svg.clientHeight===factoryHeight)return;
  factoryWidth=svg.clientWidth;factoryHeight=svg.clientHeight;
  factoryFit();factoryRender();
});
factoryResize.observe(svg);
window.BOWER_FACTORY_READY=(async()=>{
  await document.fonts.load('11.5px Safiro');await document.fonts.ready;
  S.fontSize=DRAWING_META.id==='overview'?11:11.5;
  factoryFit();factoryWidth=svg.clientWidth;factoryHeight=svg.clientHeight;
  if(factoryStatic)factoryTime=STATIC_T;
  factoryRender();window.__ready=true;factoryNotify();factoryStart();
  if(parent!==window)parent.postMessage({type:'bower-factory:ready',state:factoryState()},'*');
  return window.BOWER_FACTORY;
})();

})();</script></body></html>
