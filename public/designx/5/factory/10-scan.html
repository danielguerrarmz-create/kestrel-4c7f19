<script>(()=>{const DRAWING_META={"id":"10-scan","number":"10","title":"Scan","stage":"Reform","whatHappens":"The doubly curved rib cures on unclamped trestles. The robot scans it again against the target shape.","bower":"Bower-specific proposal: the measured second springback updates the model for the next rib's tower settings. This is the same geometry as station 07, not machine learning: line the scan up with the model, compare, correct. The trestles, the crane, the robot, the track and the scanner hardware are industry practice.","testing":"Bower's second-press springback is unmeasured (making-line: open). Springback per species and batch, which the scan loop exists to measure (register T4): assumed, to be tested.","sourceLinks":[{"title":"ZAZA Timber, MeKA and Svilans et al. scanned 15 free-form glulam prototypes and compared them with the digital model: mean deviation 0.32 to 3.84 mm per beam, greater in the direction of the second pressing, attributed to more springback in fewer, thicker layers. Industry precedent, not this rib. EC3 2026 paper (read).","url":"https://ec-3.org/wp-content/uploads/2026/08/EC32026_412.pdf"},{"title":"Yu, Khaloian and van de Kuilen model the springback and residual stress of curved glulam with mechanics, not learning. Computers and Structures, 2025 (snippet, abstract only; not read in full).","url":"https://repository.tudelft.nl/record/uuid:3f73fc6a-d833-42a6-8588-7af2e04def99"}]};
const S={};
const SQ=Math.sqrt(3)/2, TAU=Math.PI*2;
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const CP=Math.cos(.575),SP=Math.sin(.575);
const mkP=(ox,oy,s)=>(x,y,z)=>[ox+(x*CP-y*SP)*s, oy+((x*SP+y*CP)*.5-z)*s];
const n1=v=>v.toFixed(1);
const pd=(pts,close=true)=>'M'+pts.map(p=>n1(p[0])+' '+n1(p[1])).join('L')+(close?'Z':'');
function hull(pts){pts=pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);const lo=[];for(const p of pts){while(lo.length>1&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p);}const up=[];for(let i=pts.length-1;i>=0;i--){const p=pts[i];while(up.length>1&&cr(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p);}up.pop();lo.pop();return lo.concat(up);}
function circ(cx,cy,r,n=16){const a=[];for(let i=0;i<n;i++){const t=i/n*TAU+.3;a.push([cx+r*Math.cos(t),cy+r*Math.sin(t)]);}return a;}
function rr(u0,v0,u1,v1,r){r=r||0;if(r<.005)return[[u0,v0],[u1,v0],[u1,v1],[u0,v1]];r=Math.min(r,(u1-u0)/2,(v1-v0)/2);const o=[];for(const[cx,cy,a0]of[[u1-r,v0+r,-90],[u1-r,v1-r,0],[u0+r,v1-r,90],[u0+r,v0+r,180]])for(let k=0;k<=3;k++){const a=(a0+k*30)*Math.PI/180;o.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]);}return o;}
const cap2=(p,q,r0,r1)=>hull(circ(p[0],p[1],r0,14).concat(circ(q[0],q[1],r1,14)));
const mixHex=(a,b,k)=>{const h=x=>[1,3,5].map(i=>parseInt(x.slice(i,i+2),16)),A=h(a),B=h(b);return'#'+A.map((v,i)=>Math.round(lerp(v,B[i],clamp(k))).toString(16).padStart(2,'0')).join('');};

const sst=t=>{t=clamp(t);return t*t*(3-2*t)};
const ease=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const eout=t=>1-Math.pow(1-clamp(t),3);
const seg=(t,a,b)=>clamp((t-a)/(b-a));

const stepIndex=(t,bounds)=>{for(let i=0;i<bounds.length-1;i++)if(t<bounds[i+1])return i;return bounds.length-2;};

function ext(c,plane,poly,a0,a1,o){o=o||{};const P=c.P;
  const q=(p,a)=>plane==='yz'?P(a,p[0],p[1]):plane==='xz'?P(p[0],a,p[1]):P(p[0],p[1],a);
  const p0=poly.map(p=>q(p,a0)),p1=poly.map(p=>q(p,a1));
  return S.solid(hull(p0.concat(p1)),p1,o,c);}
const ln=(c,pts,cls,o)=>{o=o||{};return`<path d="${pd(pts.map(p=>c.P(p[0],p[1],p[2])),false)}" fill="none" stroke="${o.col||S.ink}" stroke-width="${o.w||.6}" ${o.dash?`stroke-dasharray="${o.dash}"`:''} stroke-linecap="round" stroke-linejoin="round" ${o.op!=null?`opacity="${n1(o.op)}"`:''}/>`;};

function hatchRect(P,x,y0,y1,z0,z1,step,dir){ // hatch inside a rectangle of the plane x=const
  let d='';const h=z1-z0,w=y1-y0;
  for(let k=-h;k<w;k+=step){ // line z = z0 + dir*(y-y0-k)
    let ya=y0+Math.max(0,k),yb=y0+Math.min(w,k+h);if(yb<=ya)continue;
    const f=y=>dir>0?z0+(y-y0-k):z1-(y-y0-k);
    const a=P(x,ya,f(ya)),b=P(x,yb,f(yb));d+=`M${n1(a[0])} ${n1(a[1])}L${n1(b[0])} ${n1(b[1])}`;}
  return d;}

/* ---- machine parts: frames, fasteners, hoses, linear track, cable chain, six-axis arm ---- */
// Frames wrap a context so any extrusion can be drawn in a moved or rotated local system.
// c.ax holds the world direction of each local axis; it decides which end cap faces the viewer.
const AX0=[[1,0,0],[0,1,0],[0,0,1]];
const v3={add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],sc:(a,k)=>[a[0]*k,a[1]*k,a[2]*k],
 cr:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
 nz:a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return[a[0]/l,a[1]/l,a[2]/l];}};
function frameC(c,o,ex,ey,ez){const A=c.ax||AX0,w=e=>[0,1,2].map(i=>e[0]*A[0][i]+e[1]*A[1][i]+e[2]*A[2][i]);
 return{P:(a,b,d)=>c.P(o[0]+a*ex[0]+b*ey[0]+d*ez[0],o[1]+a*ex[1]+b*ey[1]+d*ez[1],o[2]+a*ex[2]+b*ey[2]+d*ez[2]),ax:[w(ex),w(ey),w(ez)]};}
// Local z runs along d from o.
function alongC(c,o,d){const z=v3.nz(d),r=Math.abs(z[0])<.9?[1,0,0]:[0,1,0];const x=v3.nz(v3.add(r,v3.sc(z,-v3.dot(r,z))));return frameC(c,o,x,v3.cr(z,x),z);}
const facing=(c,k)=>{const v=(c.ax||AX0)[k];return v[0]*SP+v[1]*CP+v[2]*.5>=0;};
// Extrusion with its outlined cap always on the end nearest the viewer.
function xt(c,plane,poly,a0,a1,o){const k=plane==='yz'?0:plane==='xz'?1:2;return facing(c,k)===(a1>=a0)?ext(c,plane,poly,a0,a1,o||{}):ext(c,plane,poly,a1,a0,o||{});}
// Cylinder along a local axis; (u,v) is the centre in the other two axes, in xyz order.
function cyl(c,axis,u,v,r,a0,a1,o,n){const p=circ(u,v,r,n||14);return xt(c,axis==='z'?'xy':axis==='y'?'xz':'yz',p,a0,a1,o);}
const q3=(plane,u,v,a)=>plane==='yz'?[a,u,v]:plane==='xz'?[u,a,v]:[u,v,a];
const matFill=()=>typeof MAT!=='undefined'&&MAT?MAT.steel:S.paper;
// Hex heads or nuts lying on a face, one path.
function hexes(c,plane,pts,at,r){let d='';for(const[u,v]of pts){const h=[];for(let k=0;k<6;k++){const a=k*Math.PI/3+.26;h.push(c.P(...q3(plane,u+r*Math.cos(a),v+r*Math.sin(a),at)));}d+=pd(h);}
 return`<path d="${d}" fill="${matFill()}" stroke="${S.ink}" stroke-width=".5"/>`;}
// Circles on a face (bores, bolt holes, lenses), one path.
function rings(c,plane,pts,at,r,o){o=o||{};let d='';for(const[u,v]of pts)d+=pd(circ(u,v,r,o.n||12).map(p=>c.P(...q3(plane,p[0],p[1],at))));
 return`<path d="${d}" fill="${o.fill||'none'}" stroke="${o.col||S.ink}" stroke-width="${o.w||.5}" ${o.dash?`stroke-dasharray="${o.dash}"`:''}/>`;}
// Inner edges on a face as one path of polylines.
function edges(c,lines,o){o=o||{};let d='';for(const l of lines)d+=pd(l.map(p=>c.P(...p)),false);
 return`<path d="${d}" fill="none" stroke="${o.col||S.ink}" stroke-width="${o.w||.5}" ${o.dash?`stroke-dasharray="${o.dash}"`:''} stroke-linecap="round"/>`;}
const bez=(a,b,c2,d,n)=>Array.from({length:n+1},(_,k)=>{const u=k/n,p=(1-u)**3,q=3*u*(1-u)**2,r=3*u*u*(1-u),s=u**3;return[0,1,2].map(i=>p*a[i]+q*b[i]+r*c2[i]+s*d[i]);});
// A hose or cable: an outlined tube of width w drawing units in pixels.
function hose(c,pts,w,o){o=o||{};const d=pd(pts.map(p=>c.P(...p)),false);
 return`<path d="${d}" fill="none" stroke="${o.col||S.ink}" stroke-width="${n1(w+1.1)}" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${S.paper}" stroke-width="${n1(Math.max(.4,w-.1))}" stroke-linecap="round" stroke-linejoin="round"/>`;}

/* Linear track, KUKA KL 4000 class: feet, box beam, two profile rails, rack, end stops, trough. */
function trackBase(c,{x0,x1,y}){let s='';
 for(let x=x0+.7;x<x1-.3;x+=3.4){
  s+=xt(c,'xy',rr(x-.42,y-.82,x+.42,y+.82),0,.06,{m:'dark'});
  s+=hexes(c,'xy',[[x-.3,y-.68],[x+.3,y-.68],[x-.3,y+.68],[x+.3,y+.68]],.06,.07);
  s+=xt(c,'yz',[[y-.55,.06],[y+.55,.06],[y+.42,.2],[y-.42,.2]],x-.2,x+.2,{m:'dark'});
 }
 s+=xt(c,'yz',rr(y-.6,.2,y+.6,.5),x0,x1,{m:'steel'});
 s+=edges(c,[[[x0,y+.6,.27],[x1,y+.6,.27]],[[x0,y+.6,.43],[x1,y+.6,.43]]]);
 const rail=[[-.1,0],[.1,0],[.1,.05],[.06,.08],[.09,.1],[.09,.15],[-.09,.15],[-.09,.1],[-.06,.08],[-.1,.05]];
 for(const ry of[y-.36,y+.36])s+=xt(c,'yz',rail.map(p=>[ry+p[0],.5+p[1]]),x0+.15,x1-.15,{m:'steel'});
 let holes=[];for(let x=x0+.4;x<x1-.2;x+=.6)holes.push([x,y-.36],[x,y+.36]);s+=rings(c,'xy',holes,.65,.035,{n:6});
 // Rack on the front face; teeth as ticks
 s+=xt(c,'yz',rr(y+.6,.29,y+.68,.44),x0+.1,x1-.1,{m:'steel'});
 let d='';for(let x=x0+.16;x<x1-.12;x+=.11){const a=c.P(x,y+.68,.29),b=c.P(x,y+.68,.37);d+=`M${n1(a[0])} ${n1(a[1])}L${n1(b[0])} ${n1(b[1])}`;}
 s+=`<path d="${d}" stroke="${S.ink}" stroke-width=".4" fill="none"/>`;
 for(const xe of[x0,x1-.3]){s+=xt(c,'xy',rr(xe,y-.5,xe+.3,y+.5),.5,.85,{m:'dark'});s+=cyl(c,'x',y-.25,.72,.09,xe<x0+1?xe+.3:xe,xe<x0+1?xe+.45:xe-.15,{},10)+cyl(c,'x',y+.25,.72,.09,xe<x0+1?xe+.3:xe,xe<x0+1?xe+.45:xe-.15,{},10);}
 return s;}
// Cable trough in front of the track, drawn after the carriage.
function trackTrough(c,{x0,x1,y}){const U=[[y+.8,0],[y+1.3,0],[y+1.3,.42],[y+1.26,.42],[y+1.26,.04],[y+.84,.04],[y+.84,.42],[y+.8,.42]];
 return xt(c,'yz',U,x0+.2,x1-.2,{m:'dark'})+edges(c,[[[x0+.2,y+.84,.42],[x1-.2,y+.84,.42]]]);}
// Energy chain: fixed end xf on the trough floor, moving end on the carriage bracket at xc.
function cableChain(c,{xf,xc,xb,y}){const yf=y+1.22,yb=y+.88,z0=.05,h=.12,R=.19,zc=z0+R,P=c.P;
 const lo=[[xf,z0],[xb,z0]],arcO=[],arcI=[];for(let k=0;k<=10;k++){const a=-Math.PI/2+k/10*Math.PI;arcO.push([xb+R*Math.cos(a),zc+R*Math.sin(a)]);arcI.push([xb+(R-h)*Math.cos(a),zc+(R-h)*Math.sin(a)]);}
 const out=lo.concat(arcO,[[xc,zc+R]],[[xc,zc+R-h]],arcI.slice().reverse(),[[xf,z0+h]]);
 let s=`<path d="${pd(out.map(p=>P(p[0],yf,p[1])))}" fill="${S.paper}" stroke="${S.ink}" stroke-width=".9" stroke-linejoin="round"/>`;
 s+=`<path d="${pd([P(xc,yb,zc+R),P(xb,yb,zc+R),P(xb,yf,zc+R),P(xc,yf,zc+R)])}" fill="${S.paper}" stroke="${S.ink}" stroke-width=".6"/>`;
 let d='';const tick=(x,za,zb2,yy)=>{const a=P(x,yy,za),b=P(x,yy,zb2);d+=`M${n1(a[0])} ${n1(a[1])}L${n1(b[0])} ${n1(b[1])}`;};
 for(let x=xf+.22;x<xb;x+=.22)tick(x,z0,z0+h,yf);
 for(let x=xc+.22;x<xb;x+=.22){tick(x,zc+R-h,zc+R,yf);const a=P(x,yb,zc+R),b=P(x,yf,zc+R);d+=`M${n1(a[0])} ${n1(a[1])}L${n1(b[0])} ${n1(b[1])}`;}
 return s+`<path d="${d}" stroke="${S.ink}" stroke-width=".4" fill="none"/>`;}
// Carriage on four bearing blocks, rack drive motor, chain bracket, robot riser.
function trackCarriage(c,{cx,y,mv,riser}){let s='';const o={m:'steel',mv};
 for(const bx of[cx-.62,cx+.62])for(const by of[y-.36,y+.36]){s+=xt(c,'xy',rr(bx-.3,by-.17,bx+.3,by+.17),.56,.76,{m:'dark'});s+=xt(c,'yz',rr(by-.15,.58,by+.15,.74),bx+.3,bx+.34,{m:'dark'});}
 s+=xt(c,'xy',rr(cx-.48,y+.6,cx+.08,y+.9),.3,.76,{m:'dark'});
 s+=xt(c,'xy',rr(cx-1.02,y-.78,cx+1.02,y+.78),.76,.88,o);
 s+=hexes(c,'xy',[[cx-.85,y-.62],[cx+.85,y-.62],[cx-.85,y+.62],[cx+.85,y+.62]],.88,.06);
 s+=xt(c,'yz',[[y+.78,.88],[y+1.08,.88],[y+1.08,.43],[y+1.0,.43],[y+1.0,.82],[y+.78,.82]],cx+.82,cx+1.0,{m:'dark'});
 // Drive motor with cooling rings and connector
 const mx=cx-.2,my=y+.6;s+=cyl(c,'z',mx,my,.17,.88,1.38,o,14);
 s+=edges(c,[1.0,1.1,1.2].map(z=>circ(mx,my,.17,14).slice(0,9).map(p=>[p[0],p[1],z])));
 s+=xt(c,'xy',rr(mx-.07,my+.1,mx+.07,my+.24),1.24,1.36,{m:'dark'});
 if(riser){const h=riser;s+=xt(c,'xy',rr(cx-.48,y-.48,cx+.48,y+.48),.88,.88+h,{m:'steel'});
  s+=xt(c,'xz',[[cx+.48,.88],[cx+.48,.88+h*.6],[cx+.86,.88]],y-.03,y+.03,{m:'dark'});
  s+=xt(c,'yz',[[y+.48,.88],[y+.48,.88+h*.6],[y+.8,.88]],cx+.27,cx+.33,{m:'dark'});
  s+=xt(c,'xy',rr(cx-.7,y-.7,cx+.7,y+.7),.88+h,.98+h,{m:'steel'});}
 return s;}

/* Crane spreader beam: I-section beam, two lifting lugs with a bridle to a hook block and hoist
   ropes (the crane itself stays off the drawing), and webbing slings at each pick point down to
   the load. slings: [{x, top, bot}] where the load's top edge is at z = top and its front face
   runs down to bot; w is the load's half width in y. Back legs draw first, front legs last. */
function spreaderBeam(c,{x0,x1,y=0,z,w,slings,lift=1.3,rope=2.2}){let s='';const P=c.P,xm=(x0+x1)/2,zt=z+.3;
 const L=(pts,wd)=>`<path d="${pd(pts.map(q=>P(...q)),false)}" fill="none" stroke="${S.ink}" stroke-width="${wd}" stroke-linecap="round" stroke-linejoin="round"/>`;
 for(const g of slings)s+=L([[g.x,y,z],[g.x,y-w,g.top]],1.5);
 const I=[[-.16,0],[.16,0],[.16,.05],[.035,.05],[.035,.25],[.16,.25],[.16,.3],[-.16,.3],[-.16,.25],[-.035,.25],[-.035,.05],[-.16,.05]];
 s+=xt(c,'yz',I.map(q=>[y+q[0],z+q[1]]),x0,x1,{m:'steel'});
 for(const xe of[x0,x1])s+=xt(c,'yz',rr(y-.18,z-.02,y+.18,z+.32),xe-.03,xe+.03,{m:'dark'});
 const H=[xm,y,zt+lift],lugs=[x0+(x1-x0)*.28,x1-(x1-x0)*.28];
 for(const xl of lugs){s+=xt(c,'xz',[[xl-.14,zt],[xl+.14,zt],[xl+.07,zt+.22],[xl-.07,zt+.22]],y-.02,y+.02,{m:'dark'});s+=L([[xl,y,zt+.16],H],.9);}
 // Hook block: sheave between side plates, hook below, two hoist ropes leaving upward
 s+=L([H,[xm,y,H[2]+.18]],1.1);
 s+=xt(c,'xz',rr(xm-.24,H[2]+.18,xm+.24,H[2]+.78,.08),y-.13,y+.13,{m:'dark'});
 s+=cyl(c,'y',xm,H[2]+.48,.17,y+.13,y+.17,{m:'steel'},12);
 s+=L([[xm-.15,y,H[2]+.7],[xm-.15,y,H[2]+.78+rope]],.7)+L([[xm+.15,y,H[2]+.7],[xm+.15,y,H[2]+.78+rope]],.7);
 for(const g of slings){s+=cyl(c,'y',g.x,z-.07,.06,y-.03,y+.03,{m:'dark'},8);s+=L([[g.x,y,z-.1],[g.x,y+w,g.top],[g.x,y+w,g.bot]],1.5);}
 return s;}

/* Six-axis industrial arm, KUKA QUANTEC class. All joints lie in the plane x = const of the
   context c. Sh, El, Wr are shoulder (A2), elbow (A3) and wrist (A5) centres as [y,z].
   fd is the flange direction [dy,dz]. tool(ff) draws in the flange frame from z = 0.
   Base sits at [x,y,zb]; the column is fixed for a robot that faces -y. */
// halo: a paper gap of about 2.5 px round the arm's silhouette, so the jacks and yokes it stands
// in front of stop short of its outline instead of tangling with it. The arm is always nearer the
// viewer than the pin row, so it needs a gap, not hidden lines.
function robot6(c,o){const s=robot6Lines(c,o);if(!o.halo)return s;
 return`<defs><filter id="arm-halo" x="-5%" y="-5%" width="110%" height="110%"><feMorphology in="SourceAlpha" operator="dilate" radius="${n1(2.5*Math.max(.6,kk()))}" result="d"/><feFlood flood-color="${S.paper}"/><feComposite in2="d" operator="in"/></filter></defs><use href="#arm" filter="url(#arm-halo)"/><g id="arm">${s}</g>`;}
function robot6Lines(c,{x,y,zb,Sh,El,Wr,fd,tool,mv}){let s='';const P=c.P;
 const st={m:'steel'},dk={m:'dark'};
 // Base frame with fixing bolts, A1 gear housing and slewing ring
 const oct=[[-.72,-.45],[-.45,-.72],[.45,-.72],[.72,-.45],[.72,.45],[.45,.72],[-.45,.72],[-.72,.45]].map(p=>[x+p[0],y+p[1]]);
 s+=xt(c,'xy',oct,zb,zb+.12,dk);
 s+=hexes(c,'xy',[[x-.56,y-.3],[x-.56,y+.3],[x+.56,y-.3],[x+.56,y+.3],[x-.3,y+.56],[x+.3,y+.56]],zb+.12,.055);
 s+=cyl(c,'z',x,y,.56,zb+.12,zb+.5,st,20)+cyl(c,'z',x,y,.6,zb+.5,zb+.58,dk,20);
 // A1 motor at the back of the column
 s+=cyl(c,'z',x-.24,y+.62,.15,zb+.58,zb+1.16,st,12)+xt(c,'xy',rr(x-.3,y+.74,x-.18,y+.86),zb+1.0,zb+1.12,dk);
 // Rotating column, cast, carrying the A2 axis forward of A1
 const z1=zb+.58,col=[[y+.62,z1],[y-.62,z1],[Sh[0]-.45,Sh[1]-.55],[Sh[0]-.35,Sh[1]+.3],[Sh[0]+.2,Sh[1]+.56],[y+.5,Sh[1]+.1]];
 s+=xt(c,'yz',col,x-.46,x+.46,st);
 s+=edges(c,[[[x+.46,y+.45,z1+.12],[x+.46,Sh[0]-.3,Sh[1]-.45]]]);
 // Lower arm with recessed panel and hub bolt circle
 const len=Math.hypot(El[0]-Sh[0],El[1]-Sh[1]);
 s+=xt(c,'yz',cap2(Sh,El,.46,.34),x-.32,x+.32,{m:'steel',mv});
 const inner=hull(circ(Sh[0]+(El[0]-Sh[0])*.2,Sh[1]+(El[1]-Sh[1])*.2,.26,10).concat(circ(Sh[0]+(El[0]-Sh[0])*.82,Sh[1]+(El[1]-Sh[1])*.82,.19,10)));
 s+=edges(c,[inner.concat([inner[0]]).map(p=>[x+.32,p[0],p[1]])]);
 // A2 gearbox and motor on the near side

// Labels stay 11.5 px on screen. The svg scales its viewBox with "meet", so the larger ratio wins.

/* Placement rule for every station: put the white box in free paper first. Overlap the drawing
   only where no free paper is left, and then never over a loaded (red) part or another label.
   Leaders never cross each other or a moving machine on their way to the box. dx, dy are screen
   pixels from the anchor to the elbow, so the box can be steered into the free area.
   o.at (a world point) pins the elbow in place, so a label on a moving part keeps its box still
   in the free area while its leader follows the part. o.side (-1 or 1) fixes the text side.
   Text is always horizontal: no label, tag or dimension text is ever rotated (dimLine follows). */
function lead(c,anc,dx,dy,txt,a,o){o=o||{};if(a<.02||kk()>1.5)return'';const k=kk();const id=o.id||txt;const p=c.P(anc[0],anc[1],anc[2]);dx*=k;dy*=k;
  if(o.at){const q=c.P(...o.at);dx=q[0]-p[0];dy=q[1]-p[1];}
  const bx=p[0]+dx,by=p[1]+dy,sd=o.side||(dx<0?-1:1),col=S.ink;
  const L=Math.hypot(dx,dy),ux=-dx/L,uy=-dy/L,ah=5*k; // arrowhead at anchor
  const tip=p,b1=[tip[0]-ux*(-ah)+(-uy)*ah*.35,tip[1]-uy*(-ah)+ux*ah*.35],b2=[tip[0]-ux*(-ah)-(-uy)*ah*.35,tip[1]-uy*(-ah)-ux*ah*.35];

  const tag=o.bower?`<tspan style="fill:${S.bower||'#2a6a50'};font-size:.62em">\u25A0</tspan>\u00A0`:'';
  return`<g data-label="${id}" data-white="${o.box!==false && S.labelBoxes!==false}"${o.bower?' data-bower="true"':''} opacity="${n1(a)}"><path d="M${n1(p[0])} ${n1(p[1])}L${n1(bx)} ${n1(by)}L${n1(bx+sd*12*k)} ${n1(by)}" fill="none" stroke="${col}" stroke-width=".6"/>${hd}<text x="${n1(bx+sd*16*k)}" y="${n1(by+3.6*k)}" text-anchor="${sd<0?'end':'start'}" class="lb" style="font-size:${fsz()}px;fill:${col}">${tag}${txt}</text></g>`;}

// A leaderless label: a paper-boxed note set next to its part, such as a value beside a jack.
// It counts as a label for overlap and visibility, and not as a leader. dx, dy are screen pixels.
// Every value sits directly above its part or gets a 4 px tick, so the part is never in doubt:
// o.above centres the box just above the anchor, no tick. o.tick draws a 4 px tick from the anchor

// larger of dx and dy), so only the direction of dx, dy matters. Ticks are not leaders.

   tk=`<path d="M${n1(p[0])} ${n1(p[1])}L${n1(e[0])} ${n1(e[1])}" stroke="${col}" stroke-width=".75" fill="none"/>`;
   if(Math.abs(dx)>=Math.abs(dy)){an=dx<0?'end':'start';x=e[0]+(dx<0?-2.5:2.5)*k;y=e[1]+fs*.35;}

  const ea=P(A[0]+off[0]*.08,A[1]+off[1]*.08,A[2]+off[2]*.08),eb=P(B[0]+off[0]*.08,B[1]+off[1]*.08,B[2]+off[2]*.08);
  const ea2=P(a2[0]+e[0],a2[1]+e[1],a2[2]+e[2]),eb2=P(b2[0]+e[0],b2[1]+e[1],b2[2]+e[2]);
  s+=`<path d="M${n1(ea[0])} ${n1(ea[1])}L${n1(ea2[0])} ${n1(ea2[1])}M${n1(eb[0])} ${n1(eb[1])}L${n1(eb2[0])} ${n1(eb2[1])}M${n1(p[0])} ${n1(p[1])}L${n1(q[0])} ${n1(q[1])}"/>`;

// Deterministic surface samples. Progress leaves all earlier samples visible.
function pointCloud(c,{surface,target,progress,count=480,tolerance=.05}){

  const u=i/(count-1),v=((i*73)%count)/(count-1);

  const q=[p[0],p[1],p[2]+noise],xy=c.P(...q);

 for(let i=0;i<=40;i++)outline.push(c.P(...target(i/40,.5)));

}
// Scan points drawn as two paths, so several hundred points stay cheap. Noise is deterministic.
// Points behind progress persist. compare (0 to 1) brings in the comparison: a point further
// than tolerance from the target turns full red and grows to 1.5 times the on-target size.
// On-target points stay ink at the normal size, so the error reads at a glance.
function scanCloud(c,{surface,target,progress,count=600,noise=.03,compare=0,tolerance=.15,r=.75}){

  const u=i/(count-1);if(u>progress)break;
  const v=((i*73)%count)/(count-1),p=surface(u,v),q=target(u,v);
  const xy=c.P(p[0]+Math.sin(i*91.3)*noise*.4,p[1]+Math.sin(i*311.7)*noise,p[2]+Math.sin(i*127.1)*noise);
  const d=`M${n1(xy[0])} ${n1(xy[1])}h.01`;

  +(off?`<path d="${off}" fill="none" stroke="${red}" stroke-width="${n1(2*r*(1+.5*k))}" stroke-linecap="round"/>`:'');

// Axis of separation: a dashed ink line from the slot a part leaves to where it is now. It is
// darker than the floor lines so it reads, and it always starts at the slot on the machine.
function explodeAxis(c,a,b,o){o=o||{};const p=c.P(...a),q=c.P(...b);if(Math.hypot(p[0]-q[0],p[1]-q[1])<1)return'';

// Exploded parts keep clear space: choose offsets so a clear paper gap reads all along each part's
// length at full hold, from every neighbour, the machine it left and the other parts. A near miss
// (a part that almost touches another) reads as a collision, so open the gap or change the axis.
// Component render callbacks receive their separated context and moment palette.
// Optional: assembled(c) draws the closed assembly in true depth order; part.annotate({P},amount)
// replaces the default label so a station can sequence labels or use a dimension.
function explodedView(c,t,{start=0,open=1,hold=4,close=1,components,assembled}){
 const amount=ease(seg(t,start,start+open))*(1-ease(seg(t,start+open+hold,start+open+hold+close)));

 for(const part of components){
  const delta=part.offset.map(v=>v*amount),P=(x,y,z)=>c.P(x+delta[0],y+delta[1],z+delta[2]);
  const anchor=part.anchor||[0,0,0];

}

/* ---- scene constants (drawing units; 1 unit is not a real length) ---- */
const XL0=0, XL1=16.4, W=.62, TL=.3, NL=5, H=NL*TL, FL=4;
const TRY=6.4, HOME=-2.4, RISER=.74, RZB=.98+RISER, SHY=TRY-1.0, SHZ=RZB+2.0, L1=3.5, L2=3.6;
const TX=[1.3,4.7,8.2,11.7,15.1];
const uu=x=>clamp((x-XL0)/(XL1-XL0));
// Target form from the engine: plan curve from the first bend, elevation curve and roll from the
// second. The real rib has sprung back: a little in plan, most in elevation (the second press).
const BOWP=2.0, SAG=1.15, ZB0=2.0, PHI=.3, RP=.05, RE=.32;
const Yt=x=>BOWP*(Math.sin(Math.PI*uu(x))-.5);
const Ze=x=>{const u=uu(x);return SAG*(1-Math.sin(Math.PI*u))-.14*Math.sin(TAU*u);};
const Zt=x=>ZB0+Ze(x);
const Yr=x=>Yt(x)+RP*BOWP*(1-Math.sin(Math.PI*uu(x)));
const Zr=x=>ZB0+Ze(x)*(1-RE);
const Phi=x=>PHI*(2*uu(x)-1);
const mainP=mkP(0,0,30);
let MAT=null; // material palette, set only while the exploded moment draws

/* ---- timeline ---- */
const stepOf=t=>stepIndex(((t%DUR)+DUR)%DUR,BND);
const win=(t,a,b,r=.25)=>seg(t,a,a+r)*(1-seg(t,b-r,b));
const LAND0=.4,LAND1=2.9,LH=2.8;
const ribDrop=t=>LH*(1-ease(seg(t,LAND0,LAND1)));
// Exploded scan head while the glue cures: opens, holds over 4 s, closes before the scan.
const EX0=9.3,EXO=.6,EXH=4.4,EXC=.5;
const exAmt=t=>ease(seg(t,EX0,EX0+EXO))*(1-ease(seg(t,EX0+EXO+EXH,EX0+EXO+EXH+EXC)));
// Scan: the robot runs to the far end, then scans back toward home, so the cloud it leaves
// trails away from the arm.
const TRAV0=15.0,TRAV1=16.3,SCAN0=16.8,SCAN1=21.0,BACK1=22.4;
const scanX=t=>lerp(XL1-.05,XL0+.05,seg(t,SCAN0,SCAN1));
const CMP0=21.4,REC0=28.2,RESET=33.5;

/* ---- rib geometry: section frame at the underside centre, rolled about x ---- */
function geo(real,dz,n){n=n||48;const G=[];for(let k=0;k<=n;k++){const x=lerp(XL0,XL1,k/n),ph=Phi(x);
 G.push({x,co:Math.cos(ph),si:Math.sin(ph),y:real?Yr(x):Yt(x),z:(real?Zr(x):Zt(x))+(dz||0)});}return G;}
const gAt=(x,real)=>{const ph=Phi(x);return{x,co:Math.cos(ph),si:Math.sin(ph),y:real?Yr(x):Yt(x),z:real?Zr(x):Zt(x)};};
const SX=(g,w,h)=>[g.x,g.y+w*g.co-h*g.si,g.z+w*g.si+h*g.co];
const rollF=(c,g)=>frameC(c,[g.x,g.y,g.z],[1,0,0],[0,g.co,g.si],[0,-g.si,g.co]);

/* ---- robot path ---- */
const DIAG=[-Math.SQRT1_2,-Math.SQRT1_2],RESTW=[4.7,3.0];
// The head stands off the near top edge along the flange direction, so the line falls on the
// top face and the near face at once.
const scanW=x=>{const e=SX(gAt(clamp(x,XL0,XL1),true),W,H);return[e[1]+.8+.84*Math.SQRT1_2,e[2]+.8+.84*Math.SQRT1_2];};
const mixP=(a,b,k)=>[lerp(a[0],b[0],k),lerp(a[1],b[1],k)];
const PARK=[4.4,4.6];
function robotPose(t){let cx=HOME,W_=RESTW;
 if(t>=TRAV0&&t<TRAV1){const k=sst(seg(t,TRAV0,TRAV1));cx=lerp(HOME,XL1-.05,k);W_=mixP(RESTW,PARK,sst(seg(t,TRAV0,TRAV0+.4)));}
 else if(t>=TRAV1&&t<SCAN0){cx=XL1-.05;W_=mixP(PARK,scanW(XL1-.05),sst(seg(t,TRAV1,SCAN0-.1)));}
 else if(t>=SCAN0&&t<SCAN1){cx=scanX(t);W_=scanW(cx);}
 else if(t>=SCAN1&&t<BACK1){const k=sst(seg(t,SCAN1,BACK1));cx=lerp(XL0+.05,HOME,k);W_=mixP(scanW(XL0+.05),RESTW,k);}
 return{cx,W:W_,fd:DIAG,act:t>=SCAN0&&t<SCAN1};}

/* ---- memo: identical machine states reuse their markup ---- */
const MEMO=new Map();
const memo=(key,fn)=>{if(MAT)key+='|m';let v=MEMO.get(key);if(v===undefined){if(MEMO.size>4000)MEMO.clear();v=fn();MEMO.set(key,v);}return v;};
const dk={m:'dark'},st={m:'steel'};

/* ---- adjustable trestle: A-frames on bolted feet, telescopic posts pinned at height, a beam,
   and a tilting saddle with a rubber pad that takes the rib's roll ---- */
const AH=1.12, SH=.24, TY=1.0;
function trestleAt(x){const g=gAt(x,true),pv=[x,g.y+g.si*SH,g.z-g.co*SH];return{g,pv,zb:pv[2]-.07,yc:pv[1]};}
function aFrame(c,x,y,zt){let s='';
 const lg=sx=>{const a=[x+sx*.13,AH-.12],b=[x+sx*.7,.06],d=[b[0]-a[0],b[1]-a[1]],L=Math.hypot(...d),n=[-d[1]/L*.065,d[0]/L*.065];
  return[[a[0]+n[0],a[1]+n[1]],[b[0]+n[0],b[1]+n[1]],[b[0]-n[0],b[1]-n[1]],[a[0]-n[0],a[1]-n[1]]];};
 for(const sx of[-1,1]){const xf=x+sx*.7;
  s+=xt(c,'xy',rr(xf-.2,y-.18,xf+.2,y+.18),0,.05,dk);
  s+=hexes(c,'xy',[[xf-.12,y-.1],[xf+.12,y+.1]],.05,.04);
  s+=xt(c,'xz',lg(sx),y-.06,y+.06,st);}
 // Brace with bolts, then the head casting that holds the sleeve
 s+=xt(c,'xz',rr(x-.52,.42,x+.52,.49),y-.035,y+.035,dk);
 s+=hexes(c,'xz',[[x-.42,.455],[x+.42,.455]],y+.035,.03);
 s+=xt(c,'xz',[[x-.3,AH],[x+.3,AH],[x+.18,AH-.26],[x-.18,AH-.26]],y-.07,y+.07,dk);
 s+=hexes(c,'xz',[[x-.15,AH-.08],[x+.15,AH-.08]],y+.07,.03);
 // Sleeve, inner post with its row of height holes, pin and clip
 s+=xt(c,'xy',rr(x-.11,y-.11,x+.11,y+.11),AH,AH+.36,st);
 s+=xt(c,'xy',rr(x-.075,y-.075,x+.075,y+.075),AH+.36,zt,st);
 const holes=[];for(let z=AH+.5;z<zt-.08;z+=.13)holes.push([x,z]);
 s+=rings(c,'xz',holes,y+.075,.022,{n:6});
 s+=cyl(c,'y',x,AH+.27,.03,y-.17,y+.2,dk,8);
 s+=hose(c,[[x,y+.2,AH+.27],[x+.08,y+.22,AH+.2],[x+.06,y+.2,AH+.12]],.8);
 return s;}
function trestleBack(c,x){const{g,pv,zb,yc}=trestleAt(x);let s='';
 s+=aFrame(c,x,yc-TY,zb-.2);
 s+=cyl(c,'y',x,.62,.045,yc-TY+.06,yc+TY-.06,st,10);
 // Beam: a channel across both posts with end plates
 s+=xt(c,'xz',rr(x-.16,zb-.2,x+.16,zb),yc-TY-.22,yc+TY+.22,st);
 s+=edges(c,[[[x+.16,yc-TY-.2,zb-.1],[x+.16,yc+TY+.2,zb-.1]]],{w:.4});
 for(const ye of[yc-TY-.22,yc+TY+.22])s+=xt(c,'xz',rr(x-.17,zb-.22,x+.17,zb+.02),ye-.02,ye+.02,dk);
 // Pivot block and pin on the beam, then the tilting saddle in the rib's rolled frame
 s+=xt(c,'xz',rr(x-.2,zb,x+.2,pv[2]),yc-.1,yc+.1,dk);
 const F=rollF(c,g);
 const ck=hull(circ(0,-SH,.08,10).concat([[-.16,-.12],[.16,-.12]]));
 s+=xt(F,'yz',ck,-.22,-.16,st)+xt(F,'yz',ck,.16,.22,st);
 s+=cyl(F,'x',0,-SH,.04,-.26,.26,dk,8);
 s+=xt(F,'xy',rr(-.24,-.5,.24,.5),-.12,-.07,st);
 s+=hexes(F,'xy',[[-.17,-.42],[.17,-.42],[-.17,.42],[.17,.42]],-.07,.03);
 s+=xt(F,'xy',rr(-.2,-.44,.2,.44,.03),-.07,0,dk);
 return s;}
const trestleFront=(c,x)=>{const{zb,yc}=trestleAt(x);return aFrame(c,x,yc+TY,zb-.2);};

/* ---- the rib: five 50 mm layers from the second press, each holding the first bend's lamellae ---- */
function rib(c,G,o){o=o||{};const P=c.P,last=G.length-1,fill=MAT?MAT.wood:S.paper;let s='';
 const L=(w,h)=>G.map(g=>P(...SX(g,w,h)));
 const tB=L(-W,H),tF=L(W,H),bF=L(W,0),ge=G[last];
 const cap=[[-W,H],[W,H],[W,0],[-W,0]].map(p=>P(...SX(ge,...p)));
 s+=`<path d="${pd(tB.concat(tF.slice().reverse()))}" fill="${fill}"/><path d="${pd(tF.concat(bF.slice().reverse()))}" fill="${fill}"/><path d="${pd(cap)}" fill="${fill}"/>`;
 // Second-press glue lines on the near face, first-press glue lines on the top face
 let d='';for(let j=1;j<NL;j++)d+=pd(L(W,j*TL),false);
 s+=`<path d="${d}" fill="none" stroke="${S.ink}" stroke-width=".45" opacity=".8"/>`;
 d='';for(let j=1;j<FL;j++)d+=pd(L(-W+2*W*j/FL,H),false);
 s+=`<path d="${d}" fill="none" stroke="${S.ink}" stroke-width=".35" opacity=".55"/>`;
 // Cut end: hatched at 45 degrees, both sets of glue lines across it
 const Pe=(x,w,h)=>P(...SX(ge,w,h));
 let e=hatchRect(Pe,0,-W,W,0,H,.12,1);
 for(let j=1;j<NL;j++){const a=Pe(0,-W,j*TL),b=Pe(0,W,j*TL);e+=`M${n1(a[0])} ${n1(a[1])}L${n1(b[0])} ${n1(b[1])}`;}
 for(let j=1;j<FL;j++){const w=-W+2*W*j/FL,a=Pe(0,w,0),b=Pe(0,w,H);e+=`M${n1(a[0])} ${n1(a[1])}L${n1(b[0])} ${n1(b[1])}`;}
 s+=`<path d="${e}" fill="none" stroke="${S.ink}" stroke-width=".35"/>`;
 if(MAT){let gd='';for(const f of[.3,.55,.8])gd+=pd(G.map(g=>P(...SX(g,W,H*(f+.04*Math.sin(g.x*3.3))))),false);
  s+=`<path d="${gd}" fill="none" stroke="${MAT.grain}" stroke-width=".5" opacity=".7"/>`;}
 // Timber outlines a little heavier than the machinery: the rib is the subject.
 const wO=1.5,col=o.mv?S.acc:S.ink;
 s+=`<path d="${pd(tF,false)}" fill="none" stroke="${col}" stroke-width=".7"/>`;
 s+=`<path d="${pd(tB,false)}" fill="none" stroke="${col}" stroke-width="${wO}"/><path d="${pd(bF,false)}" fill="none" stroke="${col}" stroke-width="${wO}"/>`;
 s+=`<path d="${pd(cap)}" fill="none" stroke="${col}" stroke-width="${wO}" stroke-linejoin="round"/>`;
 s+=`<path d="${pd([tB[0],tF[0],bF[0]],false)}" fill="none" stroke="${col}" stroke-width="${wO}" stroke-linejoin="round"/>`;
 return s;}

/* ---- laser line scan head on the flange: adapter, housing, window, emitter, camera, cable ----
   The same head as at 07. Local z runs out of the flange; each part draws in its own frame so
   the exploded detail can move it. */
const EMIT=[0,-.18,.9],CAM=[.42,.12,.9];
const HEAD={
 adapter:f=>xt(f,'xy',rr(-.27,-.27,.27,.27,.04),0,.08,dk)+hexes(f,'xy',[[-.19,-.19],[.19,-.19],[-.19,.19],[.19,.19]],.08,.035),
 housing:f=>{let s=xt(f,'xy',rr(-.22,-.34,.66,.34,.04),.08,.86,st);
  s+=edges(f,[-.08,.08,.24,.4,.54].map(a=>[[a,.34,.2],[a,.34,.74]]),{w:.45});
  s+=cyl(f,'y',.36,.48,.08,.34,.44,dk,10);
  s+=hexes(f,'xy',[[-.15,-.27],[.59,-.27],[-.15,.27],[.59,.27]],.86,.025);return s;},
 window:f=>{let s=xt(f,'xy',rr(-.16,-.28,.6,.28,.03),.86,.9,dk);
  s+=rings(f,'xy',[[EMIT[0],EMIT[1]],[CAM[0],CAM[1]]],.9,.08);
  s+=edges(f,[[[-.1,-.22,.9],[.02,-.08,.9]],[[.3,.02,.9],[.44,.2,.9]]],{w:.4});return s;},
 emitter:f=>{let s=xt(f,'xy',rr(-.12,-.32,.12,-.04,.03),.36,.5,dk);
  s+=cyl(f,'z',0,-.18,.085,.5,.84,st,12);
  s+=edges(f,[.58,.66,.74].map(z=>circ(0,-.18,.085,12).slice(0,8).map(p=>[p[0],p[1],z])),{w:.4});
  s+=xt(f,'yz',[[-.24,.84],[-.12,.84],[-.15,.92],[-.21,.92]],-.04,.04,dk);return s;},
 camera:f=>{let s=xt(f,'xy',rr(.3,0,.54,.24,.02),.36,.66,st);
  s+=hexes(f,'xy',[[.34,.04],[.5,.2]],.66,.022);
  s+=cyl(f,'z',.42,.12,.09,.66,.86,dk,12)+rings(f,'xy',[[.42,.12]],.86,.055);return s;},
 cable:f=>cyl(f,'y',.36,.48,.065,.44,.6,dk,10)+hose(f,bez([.36,.6,.48],[.36,.85,.48],[.2,.95,-.2],[.05,.7,-.5],8),1.6)
};
const scanHead=f=>HEAD.adapter(f)+HEAD.housing(f)+HEAD.window(f)+HEAD.cable(f);

/* ---- exploded detail of the scan head, at a larger scale in free paper ---- */
const DET={at:mainP(5.0,-7.4,9.6),sc:80};
const detC=()=>{const c={P:mkP(DET.at[0]-70,DET.at[1]+70,DET.sc)};return frameC(c,[0,0,0],[0,0,-1],[0,1,0],[1,0,0]);};
// Offsets keep a clear gap between every pair of parts at full hold (engine rule).
const PARTS=[
 {id:'adapter',off:[0,0,0],slot:[0,0,.08],lab:'adapter plate',top:[-.27,-.2,.04]},
 {id:'housing',off:[0,0,1.0],slot:[.22,0,.08],lab:'housing',top:[-.22,-.3,.3]},
 {id:'window',off:[0,0,1.7],slot:[.22,0,.86],lab:'window',top:[.6,.2,.88]},
 {id:'emitter',off:[0,0,2.95],slot:[0,-.18,.5],lab:'laser line emitter',top:[-.12,-.3,.43]},
 {id:'camera',off:[0,0,4.2],slot:[.42,.12,.36],lab:'camera',top:[.3,.02,.5]},
 {id:'cable',off:[0,1.25,1.0],slot:[.36,.6,.48],lab:'cable and plug',top:[.36,.95,.48]}];
function detail(t,fl){const ex=fl.static?0:exAmt(t);if(ex<.01)return'';
 const f=detC(),sh=o=>frameC(f,o.map(v=>v*ex),[1,0,0],[0,1,0],[0,0,1]);let s='';
 s+=rings(f,'xy',[[0,0]],0,.24,{col:S.hid,dash:'2 2',n:16});
 MAT=MOMENT;
 for(const p of PARTS){if(p.id==='adapter')continue;
  const a=p.id==='cable'?[p.slot[0],p.slot[1]-.12,p.slot[2]+p.off[2]*ex]:p.id==='housing'?p.slot:[p.slot[0],p.slot[1],p.slot[2]+1.0*ex];
  s+=explodeAxis(f,a,p.slot.map((v,i)=>v+p.off[i]*ex),{w:.6,op:.9});}
 for(const p of PARTS)if(p.id!=='cable')s+=HEAD[p.id](sh(p.off));
 s+=HEAD.cable(sh(PARTS[5].off));
 MAT=null;
 return`<g opacity="${n1(seg(ex,0,.2))}">${s}</g>`;}
function detailLabels(t,fl){if(fl.static)return'';const la=seg(t,EX0+EXO+.15,EX0+EXO+.4)*(1-seg(t,EX0+EXO+EXH-.05,EX0+EXO+EXH+.15));if(la<.02)return'';
 const f=detC(),at=p=>p.top.map((v,i)=>v+p.off[i]);let s='';
 for(const p of PARTS)s+=tag(f,at(p),0,p.id==='cable'||p.id==='window'?1:-1,p.lab,la,{id:'x-'+p.id,tick:1});
 return s;}
// Detail circle round the real head while the exploded detail is open.
function detailRing(c,t,fl){const ex=fl.static?0:exAmt(t);if(ex<.01)return'';const rp=robotPose(t);
 const ff=alongC(c,[rp.cx,rp.W[0],rp.W[1]],[0,rp.fd[0],rp.fd[1]]),p=ff.P(0,0,.75),r=22*kk();
 const q=detC().P(0,0,.4);const d=Math.hypot(q[0]-p[0],q[1]-p[1]),u=[(q[0]-p[0])/d,(q[1]-p[1])/d];
 return`<g opacity="${n1(seg(ex,0,.3))}"><circle cx="${n1(p[0])}" cy="${n1(p[1])}" r="${n1(r)}" fill="none" stroke="${S.ink}" stroke-width=".6"/><path d="M${n1(p[0]+u[0]*r)} ${n1(p[1]+u[1]*r)}L${n1(q[0]-u[0]*40*kk())} ${n1(q[1]-u[1]*40*kk())}" stroke="${S.ink}" stroke-width=".5" stroke-dasharray="10 3 2 3" fill="none"/></g>`;}

/* ---- crane spreader for the lay down ---- */
const SLX=[3.4,13.0];
function layingSpreader(c,t){const a=seg(t,0,.5)*(1-seg(t,4.3,4.8));if(a<.01)return'';
 const held=t<LAND1+.3,dz=held?ribDrop(t):LH*sst(seg(t,LAND1+.3,4.8));
 const top=x=>{const g=gAt(x,true);return Math.max(SX(g,-W,H)[2],SX(g,W,H)[2])+(held?dz:0);};
 const zb=Math.max(top(SLX[0]),top(SLX[1]))+1.0+(held?0:dz);
 const slings=held?SLX.map(x=>{const g=gAt(x,true);return{x,top:top(x),bot:SX(g,W,0)[2]+dz};}):[];
 return`<g opacity="${n1(a)}">${spreaderBeam(c,{x0:1.6,x1:14.8,y:Yr(SLX[0]),z:zb,w:W,slings})}</g>`;}

/* ---- the operator's station: control cabinet, scan screen on a swivel arm, and one person ----
   Adapted from station 02 and drawn in a local frame at person scale. */
const GX=22.6, GY=1.4, GK=2.1;
const gC=c=>({P:(x,y,z)=>c.P(GX+x*GK,GY+y*GK,z*GK)});
const scl=c=>{const a=c.P(0,0,0),b=c.P(0,0,1);return Math.hypot(a[0]-b[0],a[1]-b[1]);};
const CB=[-1.75,-.95,-.38,.17], SCX=-.6;
function cabinet(c){let s='';const[x0,x1,y0,y1]=CB;
 s+=xt(c,'xy',rr(x0+.03,y0+.03,x1-.03,y1-.03),0,.1,dk);
 s+=xt(c,'xy',rr(x0,y0,x1,y1),.1,2.05,st);
 s+=edges(c,[[[x0+.06,y1,.18],[x1-.06,y1,.18],[x1-.06,y1,1.98],[x0+.06,y1,1.98],[x0+.06,y1,.18]]],{w:.5});
 s+=xt(c,'xz',rr(x1-.16,1.0,x1-.12,1.2),y1,y1+.05,dk);
 for(const z of[.4,1.7])s+=xt(c,'xz',rr(x0+.02,z,x0+.08,z+.12),y1,y1+.03,dk);
 s+=edges(c,[0,1,2,3,4,5].map(k=>[[x0+.2,y1,.3+k*.06],[x0+.5,y1,.3+k*.06]]),{w:.4});
 s+=xt(c,'xy',rr(x0+.15,y0+.1,x0+.45,y1-.1),2.05,2.15,dk);
 // Swivel arm and screen, its face toward the person
 s+=cyl(c,'z',x1+.06,.07,.04,1.2,1.75,dk,8)+xt(c,'xz',rr(x1,1.6,x1+.08,1.68),.04,.1,dk);
 s+=xt(c,'xy',rr(x1+.06,-.05,SCX-.05,.05),1.55,1.61,st);
 s+=xt(c,'yz',rr(-.36,1.32,.36,1.8,.02),SCX-.06,SCX,st);
 s+=xt(c,'yz',rr(-.32,1.36,.32,1.76),SCX,SCX+.005,{});
 return s;}
// Floor duct from the cabinet to the track's end, carrying the scanner and robot cables.
function duct(c){const x0=GX-1.45*GK,x1=x0+.24;return xt(c,'xy',rr(x0,GY+.36*GK,x1,TRY-.86),0,.04,dk)+xt(c,'xy',rr(17.6,TRY-1.1,x0,TRY-.86),0,.04,dk);}
// A simple, real figure: standing, facing the screen, near arm raised to it, ear defenders on.
function person(c,x,y){const P=c.P,k=scl(c);let s='';
 const body=pts=>`<path d="${pd(hull(pts))}" fill="${S.paper}" stroke="${S.ink}" stroke-width="1.1" stroke-linejoin="round"/>`;
 const cp=(a,b,ra,rb)=>body(circ(...P(...a),ra*k,12).concat(circ(...P(...b),rb*k,12)));
 const limb=(pts,r)=>{let o='';for(let i=0;i<pts.length-1;i++)o+=cp(pts[i],pts[i+1],r[i],r[i+1]);return o;};
 const L=(pts,w)=>`<path d="${pd(pts.map(p=>P(...p)),false)}" fill="none" stroke="${S.ink}" stroke-width="${w||.6}" stroke-linecap="round"/>`;
 s+=cp([x+.06,y-.1,.035],[x-.16,y-.11,.035],.045,.04)+limb([[x,y-.1,.9],[x-.03,y-.11,.5],[x,y-.11,.1]],[.085,.065,.05]);
 s+=limb([[x,y-.19,1.4],[x+.03,y-.23,1.1],[x-.01,y-.22,.86]],[.06,.05,.04])+cp([x-.01,y-.22,.86],[x-.03,y-.22,.79],.042,.038);
 s+=cp([x+.08,y+.12,.035],[x-.14,y+.13,.035],.045,.04)+limb([[x,y+.1,.9],[x-.05,y+.12,.5],[x+.02,y+.13,.1]],[.088,.067,.05]);
 s+=body([[x,y-.1,.93],[x,y+.1,.93],[x,y-.17,1.42],[x,y+.17,1.42],[x-.04,y,1.3]].flatMap(p=>circ(...P(...p),.11*k,12)));
 s+=L([[x+.1,y-.14,.99],[x+.1,y+.15,.99]],.8)+L([[x+.1,y-.17,1.16],[x+.1,y+.18,1.16]],1.6)+L([[x+.1,y-.18,1.27],[x+.1,y+.19,1.27]],1.6);
 s+=L([[x+.06,y-.08,1.49],[x+.08,y,1.45],[x+.06,y+.08,1.49]],.6);
 s+=cp([x,y,1.47],[x-.01,y,1.56],.05,.048);
 s+=body(circ(...P(x-.02,y,1.62),.098*k,16).concat(circ(...P(x-.03,y,1.69),.09*k,16)));
 s+=body(circ(...P(x-.02,y+.1,1.65),.04*k,10));

const sp=(pts,col,w,dash,op)=>`<path d="${pd(pts,false)}" fill="none" stroke="${col}" stroke-width="${w}" ${dash?`stroke-dasharray="${dash}"`:''} stroke-linecap="round" stroke-linejoin="round" ${op!=null?`opacity="${n1(op)}"`:''}/>`;
// Rib surface for the scan: u along the rib, v over the top face then down the near face.
const VT=.45;
const ribPt=(u,v,real)=>{const g=gAt(lerp(XL1,XL0,u),real);return v<VT?SX(g,-W+2*W*v/VT,H):SX(g,W,H*(1-(v-VT)/(1-VT)));};

// takes a red in proportion to its distance from the target, in four steps.
const NPT=960,TOL=.07,EMAX=.36;

 const e=Math.hypot(p[0]-q[0],p[1]-q[1],p[2]-q[2]);a.push({u,pn,b:e<TOL?0:Math.min(3,1+Math.floor((e-TOL)/(EMAX-TOL)*3))});}return a;})();

 for(const q of CLOUD){if(q.u>prog)break;const xy=P(...q.pn);paths[cmp>.01?q.b:0]+=`M${n1(xy[0])} ${n1(xy[1])}h.01`;}
 let s='';paths.forEach((d,b)=>{if(!d)return;const col=b?mixHex(S.ink,S.acc,cmp*(.45+.55*b/3)):S.ink;
  s+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="${n1(1.5*(1+.22*b*cmp))}" stroke-linecap="round"/>`;});

const STEPS=[
 ["Lay down","The crane lays the doubly curved rib on unclamped trestles."],
 ["Cure","The glue finishes curing. Nothing clamps the rib."],
 ["Scan","A laser line sweeps the rib and leaves a point cloud."],

/* ---- page plumbing ---- */
const $=id=>document.getElementById(id);
const svg=$('s'),root=$('g');
let VB=null;
// Loop seam: only transient parts fade, over 0.5 s at each end. The shop (bed, pins, yokes,
// track, robot) stays at full strength. Overlays always fade; a station wraps its own transient
// geometry (the rib) in seamA(t, flags) inside drawScene.
const seamA=(t,flags)=>flags&&flags.static?1:Math.min(seg(t,0,.5),1-seg(t,DUR-.5,DUR));
function frame(t,flags){
  const started=performance.now();flags=flags||{};
  const a=seamA(t,flags);
  let inner=drawScene(mainC,t,flags);
  const over=S.overlay?S.overlay(mainC,t,flags):'';
  if(over&&a>.005)inner+=`<g opacity="${n1(a)}">${over}</g>`;
  root.innerHTML=inner;
  collectAnnotations();window.__frameMS=performance.now()-started;
}
// Fit the viewBox tightly to the drawing over FIT_TIMES. The svg fills the stage and scales
// with "meet", centred, so the machine is as large as the free stage allows.
function fit(){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  // Geometry only: labels are placed inside the fitted area, so they must not widen it.
  for(const t of FIT_TIMES){root.innerHTML=drawScene(mainC,t,{})+(S.overlay?S.overlay(mainC,t,{}):'');for(const e of root.querySelectorAll('[data-label],[data-dimension]'))e.style.display='none';const b=root.getBBox();x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.width);y1=Math.max(y1,b.y+b.height);}
  const pad=24;VB=[x0-pad,y0-pad,x1-x0+2*pad,y1-y0+2*pad];svg.setAttribute('viewBox',VB.map(n1).join(' '));
  // A constant whole-drawing lift balances the main machine when exploded details leave.
  // Keep each station's scale fixed across every step. Offsets are viewBox fractions.
  const station=DRAWING_META.number;
  const lift=0;
  root.setAttribute('transform',`translate(0 ${n1(-VB[3]*lift)})`);
  svg.setAttribute('preserveAspectRatio','xMidYMid meet');
}

function factoryState(){

    playing:!!factoryRaf,active:factoryActive,reducedMotion:factoryMedia.matches,

function factoryFit(){
  // Some scenes place insets after the initial viewBox is known. Reconcile their
  // full timeline with the compact deck viewport, retaining one stable camera.
  VB=null;root.removeAttribute('transform');fit();
  if(DRAWING_META.id==='overview')return;
  const times=[...new Set([...FIT_TIMES,...(typeof REVIEW_TIMES!=='undefined'?REVIEW_TIMES:[]),STATIC_T])];
  for(let pass=0;pass<8;pass++){
    let x0=VB[0],y0=VB[1],x1=x0+VB[2],y1=y0+VB[3];
    const pad=8*Math.max(VB[2]/Math.max(1,svg.clientWidth),VB[3]/Math.max(1,svg.clientHeight));
    for(const value of times){
      frame(value,{});
      // SVG getBBox includes geometry outside clip paths. The visible inset
      // outlines already bound those details; invisible shearing tools must
      // not enlarge the camera by several metres as they leave the inset.
      for(const clipped of root.querySelectorAll('[clip-path]'))clipped.style.display='none';
      const b=root.getBBox();
      x0=Math.min(x0,b.x-pad);y0=Math.min(y0,b.y-pad);
      x1=Math.max(x1,b.x+b.width+pad);y1=Math.max(y1,b.y+b.height+pad);
    }
    if(Math.abs(x0-VB[0])+Math.abs(y0-VB[1])+Math.abs(x1-VB[0]-VB[2])+Math.abs(y1-VB[1]-VB[3])<.5)break;
    VB=[x0,y0,x1-x0,y1-y0];svg.setAttribute('viewBox',VB.map(n1).join(' '));
  }
}

function factoryTick(now){

  if(factoryLast)factoryTime=(factoryTime+(now-factoryLast)/1000)%DUR;
  factoryLast=now;factoryStatic=false;factoryRender();
  factoryRaf=requestAnimationFrame(factoryTick);
  if(now-factoryEmit>120){factoryEmit=now;factoryNotify();}
}
function factoryStart(){
  if(factoryReady()&&factoryActive&&factoryIntent&&!document.hidden&&!factoryMedia.matches&&!factoryRaf){
    factoryLast=0;factoryRaf=requestAnimationFrame(factoryTick);

function factorySeek(value){
  const parsed=Number(value);if(!Number.isFinite(parsed))return factoryState();
  factoryStop();factoryIntent=false;factoryStatic=false;
  factoryTime=Math.max(0,Math.min(DUR,parsed));

// The file:// preview has opaque origins. Only its actual parent may issue the small
// public drawing API; no arbitrary code, URLs, storage or DOM commands are accepted.
window.addEventListener('message',async event=>{
  if(event.source!==parent||parent===window||event.data?.type!=='bower-factory:command')return;
  const {requestId,action,args}=event.data;
  const allowed={state:'getState',getState:'getState',setActive:'setActive',play:'play',pause:'pause',seek:'seek',renderStatic:'renderStatic',exportSvg:'exportSvg'};
  const method=Object.hasOwn(allowed,action)?allowed[action]:null;
  if(!method)return;
  try{
    await window.BOWER_FACTORY_READY;
    const result=window.BOWER_FACTORY[method](...(Array.isArray(args)?args:[]));
    parent.postMessage({type:'bower-factory:reply',requestId,result},'*');
  }catch(error){parent.postMessage({type:'bower-factory:reply',requestId,error:String(error?.message||error)},'*');}
});
