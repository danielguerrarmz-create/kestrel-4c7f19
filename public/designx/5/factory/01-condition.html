<script>(()=>{const DRAWING_META={"id":"01-condition","number":"01","title":"Condition","stage":"Prepare","whatHappens":"Packs from the sawmill are restacked on spacer sticks and wait in a steady climate until each board meters 10 to 12%. Boards then leave one at a time for grading.","bower":"Nothing new here. A conditioning store with stickered stacks, air flow and moisture checks is industry practice. The chain deck, layer gantry, stick placer, rack, lift table and roller conveyor are standard handling. This station has no Bower-specific machine. Nothing is steamed.","testing":"EN 14080 Annex G covers moisture, but its values are paywalled and were not read. The store's temperature and humidity setpoints, the dwell time in the store, the stick size and any kiln schedule have no source, so none is drawn or printed. The 10 to 12% target is a definition of this line, not a measured result.","sourceLinks":[{"title":"EN 14080:2013, glued laminated timber: requirements. The contents list shows Annex G, which covers moisture. Its values are paywalled and were not read. Industry practice, standard contents page (iTeh sample, read).","url":"https://iteh.es/catalog/standards/cen/f5a36e99-021d-44cb-8dec-9e41df42d7a5/en-14080-2013"},{"title":"Kiilto Kestopur 1010, a one-component PUR glue: the maker runs its open-time test at 15% wood moisture. Industry practice. Product page (snippet).","url":"https://kiilto.com/product/kestopur-1010"}]};
const S={};
const SQ=Math.sqrt(3)/2, TAU=Math.PI*2;
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const CP=Math.cos(.575),SP=Math.sin(.575);
const mkP=(ox,oy,s)=>(x,y,z)=>[ox+(x*CP-y*SP)*s, oy+((x*SP+y*CP)*.5-z)*s];
const n1=v=>v.toFixed(1);
const pd=(pts,close=true)=>'M'+pts.map(p=>n1(p[0])+' '+n1(p[1])).join('L')+(close?'Z':'');
function hull(pts){pts=pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);const lo=[];for(const p of pts){while(lo.length>1&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p);}const up=[];for(let i=pts.length-1;i>=0;i--){const p=pts[i];while(up.length>1&&cr(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p);}up.pop();lo.pop();return lo.concat(up);}
function circ(cx,cy,r,n=16){const a=[];for(let i=0;i<n;i++){const t=i/n*TAU+.3;a.push([cx+r*Math.cos(t),cy+r*Math.sin(t)]);}return a;}
function rr(u0,v0,u1,v1,r){r=r||0;if(r<.005)return[[u0,v0],[u1,v0],[u1,v1],[u0,v1]];r=Math.min(r,(u1-u0)/2,(v1-v0)/2);const o=[];for(const[cx,cy,a0]of[[u1-r,v0+r,-90],[u1-r,v1-r,0],[u0+r,v1-r,90],[u0+r,v0+r,180]])for(let k=0;k<=3;k++){const a=(a0+k*30)*Math.PI/180;o.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]);}return o;}
const cap2=(p,q,r0,r1)=>hull(circ(p[0],p[1],r0,14).concat(circ(q[0],q[1],r1,14)));
const mixHex=(a,b,k)=>{const h=x=>[1,3,5].map(i=>parseInt(x.slice(i,i+2),16)),A=h(a),B=h(b);return'#'+A.map((v,i)=>Math.round(lerp(v,B[i],clamp(k))).toString(16).padStart(2,'0')).join('');};

const sst=t=>{t=clamp(t);return t*t*(3-2*t)};
const ease=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const eout=t=>1-Math.pow(1-clamp(t),3);
const seg=(t,a,b)=>clamp((t-a)/(b-a));

const stepIndex=(t,bounds)=>{for(let i=0;i<bounds.length-1;i++)if(t<bounds[i+1])return i;return bounds.length-2;};

function ext(c,plane,poly,a0,a1,o){o=o||{};const P=c.P;
  const q=(p,a)=>plane==='yz'?P(a,p[0],p[1]):plane==='xz'?P(p[0],a,p[1]):P(p[0],p[1],a);
  const p0=poly.map(p=>q(p,a0)),p1=poly.map(p=>q(p,a1));
  return S.solid(hull(p0.concat(p1)),p1,o,c);}
const ln=(c,pts,cls,o)=>{o=o||{};return`<path d="${pd(pts.map(p=>c.P(p[0],p[1],p[2])),false)}" fill="none" stroke="${o.col||S.ink}" stroke-width="${o.w||.6}" ${o.dash?`stroke-dasharray="${o.dash}"`:''} stroke-linecap="round" stroke-linejoin="round" ${o.op!=null?`opacity="${n1(o.op)}"`:''}/>`;};

function hatchRect(P,x,y0,y1,z0,z1,step,dir){ // hatch inside a rectangle of the plane x=const
  let d='';const h=z1-z0,w=y1-y0;
  for(let k=-h;k<w;k+=step){ // line z = z0 + dir*(y-y0-k)
    let ya=y0+Math.max(0,k),yb=y0+Math.min(w,k+h);if(yb<=ya)continue;
    const f=y=>dir>0?z0+(y-y0-k):z1-(y-y0-k);
    const a=P(x,ya,f(ya)),b=P(x,yb,f(yb));d+=`M${n1(a[0])} ${n1(a[1])}L${n1(b[0])} ${n1(b[1])}`;}
  return d;}

/* ---- machine parts: frames, fasteners, hoses, linear track, cable chain, six-axis arm ---- */
// Frames wrap a context so any extrusion can be drawn in a moved or rotated local system.
// c.ax holds the world direction of each local axis; it decides which end cap faces the viewer.
const AX0=[[1,0,0],[0,1,0],[0,0,1]];
const v3={add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],sc:(a,k)=>[a[0]*k,a[1]*k,a[2]*k],
 cr:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
 nz:a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return[a[0]/l,a[1]/l,a[2]/l];}};
function frameC(c,o,ex,ey,ez){const A=c.ax||AX0,w=e=>[0,1,2].map(i=>e[0]*A[0][i]+e[1]*A[1][i]+e[2]*A[2][i]);
 return{P:(a,b,d)=>c.P(o[0]+a*ex[0]+b*ey[0]+d*ez[0],o[1]+a*ex[1]+b*ey[1]+d*ez[1],o[2]+a*ex[2]+b*ey[2]+d*ez[2]),ax:[w(ex),w(ey),w(ez)]};}
// Local z runs along d from o.
function alongC(c,o,d){const z=v3.nz(d),r=Math.abs(z[0])<.9?[1,0,0]:[0,1,0];const x=v3.nz(v3.add(r,v3.sc(z,-v3.dot(r,z))));return frameC(c,o,x,v3.cr(z,x),z);}
const facing=(c,k)=>{const v=(c.ax||AX0)[k];return v[0]*SP+v[1]*CP+v[2]*.5>=0;};
// Extrusion with its outlined cap always on the end nearest the viewer.
function xt(c,plane,poly,a0,a1,o){const k=plane==='yz'?0:plane==='xz'?1:2;return facing(c,k)===(a1>=a0)?ext(c,plane,poly,a0,a1,o||{}):ext(c,plane,poly,a1,a0,o||{});}
// Cylinder along a local axis; (u,v) is the centre in the other two axes, in xyz order.
function cyl(c,axis,u,v,r,a0,a1,o,n){const p=circ(u,v,r,n||14);return xt(c,axis==='z'?'xy':axis==='y'?'xz':'yz',p,a0,a1,o);}
const q3=(plane,u,v,a)=>plane==='yz'?[a,u,v]:plane==='xz'?[u,a,v]:[u,v,a];
const matFill=()=>typeof MAT!=='undefined'&&MAT?MAT.steel:S.paper;
// Hex heads or nuts lying on a face, one path.
function hexes(c,plane,pts,at,r){let d='';for(const[u,v]of pts){const h=[];for(let k=0;k<6;k++){const a=k*Math.PI/3+.26;h.push(c.P(...q3(plane,u+r*Math.cos(a),v+r*Math.sin(a),at)));}d+=pd(h);}
 return`<path d="${d}" fill="${matFill()}" stroke="${S.ink}" stroke-width=".5"/>`;}
// Circles on a face (bores, bolt holes, lenses), one path.
function rings(c,plane,pts,at,r,o){o=o||{};let d='';for(const[u,v]of pts)d+=pd(circ(u,v,r,o.n||12).map(p=>c.P(...q3(plane,p[0],p[1],at))));
 return`<path d="${d}" fill="${o.fill||'none'}" stroke="${o.col||S.ink}" stroke-width="${o.w||.5}" ${o.dash?`stroke-dasharray="${o.dash}"`:''}/>`;}
// Inner edges on a face as one path of polylines.
function edges(c,lines,o){o=o||{};let d='';for(const l of lines)d+=pd(l.map(p=>c.P(...p)),false);
 return`<path d="${d}" fill="none" stroke="${o.col||S.ink}" stroke-width="${o.w||.5}" ${o.dash?`stroke-dasharray="${o.dash}"`:''} stroke-linecap="round"/>`;}
const bez=(a,b,c2,d,n)=>Array.from({length:n+1},(_,k)=>{const u=k/n,p=(1-u)**3,q=3*u*(1-u)**2,r=3*u*u*(1-u),s=u**3;return[0,1,2].map(i=>p*a[i]+q*b[i]+r*c2[i]+s*d[i]);});
// A hose or cable: an outlined tube of width w drawing units in pixels.
function hose(c,pts,w,o){o=o||{};const d=pd(pts.map(p=>c.P(...p)),false);
 return`<path d="${d}" fill="none" stroke="${o.col||S.ink}" stroke-width="${n1(w+1.1)}" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${S.paper}" stroke-width="${n1(Math.max(.4,w-.1))}" stroke-linecap="round" stroke-linejoin="round"/>`;}

/* Linear track, KUKA KL 4000 class: feet, box beam, two profile rails, rack, end stops, trough. */
function trackBase(c,{x0,x1,y}){let s='';
 for(let x=x0+.7;x<x1-.3;x+=3.4){
  s+=xt(c,'xy',rr(x-.42,y-.82,x+.42,y+.82),0,.06,{m:'dark'});
  s+=hexes(c,'xy',[[x-.3,y-.68],[x+.3,y-.68],[x-.3,y+.68],[x+.3,y+.68]],.06,.07);
  s+=xt(c,'yz',[[y-.55,.06],[y+.55,.06],[y+.42,.2],[y-.42,.2]],x-.2,x+.2,{m:'dark'});
 }
 s+=xt(c,'yz',rr(y-.6,.2,y+.6,.5),x0,x1,{m:'steel'});
 s+=edges(c,[[[x0,y+.6,.27],[x1,y+.6,.27]],[[x0,y+.6,.43],[x1,y+.6,.43]]]);
 const rail=[[-.1,0],[.1,0],[.1,.05],[.06,.08],[.09,.1],[.09,.15],[-.09,.15],[-.09,.1],[-.06,.08],[-.1,.05]];
 for(const ry of[y-.36,y+.36])s+=xt(c,'yz',rail.map(p=>[ry+p[0],.5+p[1]]),x0+.15,x1-.15,{m:'steel'});
 let holes=[];for(let x=x0+.4;x<x1-.2;x+=.6)holes.push([x,y-.36],[x,y+.36]);s+=rings(c,'xy',holes,.65,.035,{n:6});
 // Rack on the front face; teeth as ticks
 s+=xt(c,'yz',rr(y+.6,.29,y+.68,.44),x0+.1,x1-.1,{m:'steel'});
 let d='';for(let x=x0+.16;x<x1-.12;x+=.11){const a=c.P(x,y+.68,.29),b=c.P(x,y+.68,.37);d+=`M${n1(a[0])} ${n1(a[1])}L${n1(b[0])} ${n1(b[1])}`;}
 s+=`<path d="${d}" stroke="${S.ink}" stroke-width=".4" fill="none"/>`;
 for(const xe of[x0,x1-.3]){s+=xt(c,'xy',rr(xe,y-.5,xe+.3,y+.5),.5,.85,{m:'dark'});s+=cyl(c,'x',y-.25,.72,.09,xe<x0+1?xe+.3:xe,xe<x0+1?xe+.45:xe-.15,{},10)+cyl(c,'x',y+.25,.72,.09,xe<x0+1?xe+.3:xe,xe<x0+1?xe+.45:xe-.15,{},10);}
 return s;}
// Cable trough in front of the track, drawn after the carriage.
function trackTrough(c,{x0,x1,y}){const U=[[y+.8,0],[y+1.3,0],[y+1.3,.42],[y+1.26,.42],[y+1.26,.04],[y+.84,.04],[y+.84,.42],[y+.8,.42]];
 return xt(c,'yz',U,x0+.2,x1-.2,{m:'dark'})+edges(c,[[[x0+.2,y+.84,.42],[x1-.2,y+.84,.42]]]);}
// Energy chain: fixed end xf on the trough floor, moving end on the carriage bracket at xc.
function cableChain(c,{xf,xc,xb,y}){const yf=y+1.22,yb=y+.88,z0=.05,h=.12,R=.19,zc=z0+R,P=c.P;
 const lo=[[xf,z0],[xb,z0]],arcO=[],arcI=[];for(let k=0;k<=10;k++){const a=-Math.PI/2+k/10*Math.PI;arcO.push([xb+R*Math.cos(a),zc+R*Math.sin(a)]);arcI.push([xb+(R-h)*Math.cos(a),zc+(R-h)*Math.sin(a)]);}
 const out=lo.concat(arcO,[[xc,zc+R]],[[xc,zc+R-h]],arcI.slice().reverse(),[[xf,z0+h]]);
 let s=`<path d="${pd(out.map(p=>P(p[0],yf,p[1])))}" fill="${S.paper}" stroke="${S.ink}" stroke-width=".9" stroke-linejoin="round"/>`;
 s+=`<path d="${pd([P(xc,yb,zc+R),P(xb,yb,zc+R),P(xb,yf,zc+R),P(xc,yf,zc+R)])}" fill="${S.paper}" stroke="${S.ink}" stroke-width=".6"/>`;
 let d='';const tick=(x,za,zb2,yy)=>{const a=P(x,yy,za),b=P(x,yy,zb2);d+=`M${n1(a[0])} ${n1(a[1])}L${n1(b[0])} ${n1(b[1])}`;};
 for(let x=xf+.22;x<xb;x+=.22)tick(x,z0,z0+h,yf);
 for(let x=xc+.22;x<xb;x+=.22){tick(x,zc+R-h,zc+R,yf);const a=P(x,yb,zc+R),b=P(x,yf,zc+R);d+=`M${n1(a[0])} ${n1(a[1])}L${n1(b[0])} ${n1(b[1])}`;}
 return s+`<path d="${d}" stroke="${S.ink}" stroke-width=".4" fill="none"/>`;}
// Carriage on four bearing blocks, rack drive motor, chain bracket, robot riser.
function trackCarriage(c,{cx,y,mv,riser}){let s='';const o={m:'steel',mv};
 for(const bx of[cx-.62,cx+.62])for(const by of[y-.36,y+.36]){s+=xt(c,'xy',rr(bx-.3,by-.17,bx+.3,by+.17),.56,.76,{m:'dark'});s+=xt(c,'yz',rr(by-.15,.58,by+.15,.74),bx+.3,bx+.34,{m:'dark'});}
 s+=xt(c,'xy',rr(cx-.48,y+.6,cx+.08,y+.9),.3,.76,{m:'dark'});
 s+=xt(c,'xy',rr(cx-1.02,y-.78,cx+1.02,y+.78),.76,.88,o);
 s+=hexes(c,'xy',[[cx-.85,y-.62],[cx+.85,y-.62],[cx-.85,y+.62],[cx+.85,y+.62]],.88,.06);
 s+=xt(c,'yz',[[y+.78,.88],[y+1.08,.88],[y+1.08,.43],[y+1.0,.43],[y+1.0,.82],[y+.78,.82]],cx+.82,cx+1.0,{m:'dark'});
 // Drive motor with cooling rings and connector
 const mx=cx-.2,my=y+.6;s+=cyl(c,'z',mx,my,.17,.88,1.38,o,14);
 s+=edges(c,[1.0,1.1,1.2].map(z=>circ(mx,my,.17,14).slice(0,9).map(p=>[p[0],p[1],z])));
 s+=xt(c,'xy',rr(mx-.07,my+.1,mx+.07,my+.24),1.24,1.36,{m:'dark'});
 if(riser){const h=riser;s+=xt(c,'xy',rr(cx-.48,y-.48,cx+.48,y+.48),.88,.88+h,{m:'steel'});
  s+=xt(c,'xz',[[cx+.48,.88],[cx+.48,.88+h*.6],[cx+.86,.88]],y-.03,y+.03,{m:'dark'});
  s+=xt(c,'yz',[[y+.48,.88],[y+.48,.88+h*.6],[y+.8,.88]],cx+.27,cx+.33,{m:'dark'});
  s+=xt(c,'xy',rr(cx-.7,y-.7,cx+.7,y+.7),.88+h,.98+h,{m:'steel'});}
 return s;}

/* Crane spreader beam: I-section beam, two lifting lugs with a bridle to a hook block and hoist
   ropes (the crane itself stays off the drawing), and webbing slings at each pick point down to
   the load. slings: [{x, top, bot}] where the load's top edge is at z = top and its front face
   runs down to bot; w is the load's half width in y. Back legs draw first, front legs last. */
function spreaderBeam(c,{x0,x1,y=0,z,w,slings,lift=1.3,rope=2.2}){let s='';const P=c.P,xm=(x0+x1)/2,zt=z+.3;
 const L=(pts,wd)=>`<path d="${pd(pts.map(q=>P(...q)),false)}" fill="none" stroke="${S.ink}" stroke-width="${wd}" stroke-linecap="round" stroke-linejoin="round"/>`;
 for(const g of slings)s+=L([[g.x,y,z],[g.x,y-w,g.top]],1.5);
 const I=[[-.16,0],[.16,0],[.16,.05],[.035,.05],[.035,.25],[.16,.25],[.16,.3],[-.16,.3],[-.16,.25],[-.035,.25],[-.035,.05],[-.16,.05]];
 s+=xt(c,'yz',I.map(q=>[y+q[0],z+q[1]]),x0,x1,{m:'steel'});
 for(const xe of[x0,x1])s+=xt(c,'yz',rr(y-.18,z-.02,y+.18,z+.32),xe-.03,xe+.03,{m:'dark'});
 const H=[xm,y,zt+lift],lugs=[x0+(x1-x0)*.28,x1-(x1-x0)*.28];
 for(const xl of lugs){s+=xt(c,'xz',[[xl-.14,zt],[xl+.14,zt],[xl+.07,zt+.22],[xl-.07,zt+.22]],y-.02,y+.02,{m:'dark'});s+=L([[xl,y,zt+.16],H],.9);}
 // Hook block: sheave between side plates, hook below, two hoist ropes leaving upward
 s+=L([H,[xm,y,H[2]+.18]],1.1);
 s+=xt(c,'xz',rr(xm-.24,H[2]+.18,xm+.24,H[2]+.78,.08),y-.13,y+.13,{m:'dark'});
 s+=cyl(c,'y',xm,H[2]+.48,.17,y+.13,y+.17,{m:'steel'},12);
 s+=L([[xm-.15,y,H[2]+.7],[xm-.15,y,H[2]+.78+rope]],.7)+L([[xm+.15,y,H[2]+.7],[xm+.15,y,H[2]+.78+rope]],.7);
 for(const g of slings){s+=cyl(c,'y',g.x,z-.07,.06,y-.03,y+.03,{m:'dark'},8);s+=L([[g.x,y,z-.1],[g.x,y+w,g.top],[g.x,y+w,g.bot]],1.5);}
 return s;}

/* Six-axis industrial arm, KUKA QUANTEC class. All joints lie in the plane x = const of the
   context c. Sh, El, Wr are shoulder (A2), elbow (A3) and wrist (A5) centres as [y,z].
   fd is the flange direction [dy,dz]. tool(ff) draws in the flange frame from z = 0.
   Base sits at [x,y,zb]; the column is fixed for a robot that faces -y. */
// halo: a paper gap of about 2.5 px round the arm's silhouette, so the jacks and yokes it stands
// in front of stop short of its outline instead of tangling with it. The arm is always nearer the
// viewer than the pin row, so it needs a gap, not hidden lines.
function robot6(c,o){const s=robot6Lines(c,o);if(!o.halo)return s;
 return`<defs><filter id="arm-halo" x="-5%" y="-5%" width="110%" height="110%"><feMorphology in="SourceAlpha" operator="dilate" radius="${n1(2.5*Math.max(.6,kk()))}" result="d"/><feFlood flood-color="${S.paper}"/><feComposite in2="d" operator="in"/></filter></defs><use href="#arm" filter="url(#arm-halo)"/><g id="arm">${s}</g>`;}
function robot6Lines(c,{x,y,zb,Sh,El,Wr,fd,tool,mv}){let s='';const P=c.P;
 const st={m:'steel'},dk={m:'dark'};
 // Base frame with fixing bolts, A1 gear housing and slewing ring
 const oct=[[-.72,-.45],[-.45,-.72],[.45,-.72],[.72,-.45],[.72,.45],[.45,.72],[-.45,.72],[-.72,.45]].map(p=>[x+p[0],y+p[1]]);
 s+=xt(c,'xy',oct,zb,zb+.12,dk);
 s+=hexes(c,'xy',[[x-.56,y-.3],[x-.56,y+.3],[x+.56,y-.3],[x+.56,y+.3],[x-.3,y+.56],[x+.3,y+.56]],zb+.12,.055);
 s+=cyl(c,'z',x,y,.56,zb+.12,zb+.5,st,20)+cyl(c,'z',x,y,.6,zb+.5,zb+.58,dk,20);
 // A1 motor at the back of the column
 s+=cyl(c,'z',x-.24,y+.62,.15,zb+.58,zb+1.16,st,12)+xt(c,'xy',rr(x-.3,y+.74,x-.18,y+.86),zb+1.0,zb+1.12,dk);
 // Rotating column, cast, carrying the A2 axis forward of A1
 const z1=zb+.58,col=[[y+.62,z1],[y-.62,z1],[Sh[0]-.45,Sh[1]-.55],[Sh[0]-.35,Sh[1]+.3],[Sh[0]+.2,Sh[1]+.56],[y+.5,Sh[1]+.1]];
 s+=xt(c,'yz',col,x-.46,x+.46,st);
 s+=edges(c,[[[x+.46,y+.45,z1+.12],[x+.46,Sh[0]-.3,Sh[1]-.45]]]);
 // Lower arm with recessed panel and hub bolt circle
 const len=Math.hypot(El[0]-Sh[0],El[1]-Sh[1]);
 s+=xt(c,'yz',cap2(Sh,El,.46,.34),x-.32,x+.32,{m:'steel',mv});
 const inner=hull(circ(Sh[0]+(El[0]-Sh[0])*.2,Sh[1]+(El[1]-Sh[1])*.2,.26,10).concat(circ(Sh[0]+(El[0]-Sh[0])*.82,Sh[1]+(El[1]-Sh[1])*.82,.19,10)));
 s+=edges(c,[inner.concat([inner[0]]).map(p=>[x+.32,p[0],p[1]])]);
 // A2 gearbox and motor on the near side

   pixels from the anchor to the elbow, so the box can be steered into the free area.
   o.at (a world point) pins the elbow in place, so a label on a moving part keeps its box still

// length at full hold, from every neighbour, the machine it left and the other parts. A near miss
// (a part that almost touches another) reads as a collision, so open the gap or change the axis.
// Component render callbacks receive their separated context and moment palette.

function explodedView(c,t,{start=0,open=1,hold=4,close=1,components,assembled}){

   pins in a sample board report to a logger. Wetter boards are drawn darker. The oldest stack sits

const REVIEW_TIMES=[2.5,8.3,9.1,15.6,20.6,22.8,26.4,29.8,13.9], VIEWPORT_T=20.6;
/* ---- scene constants (drawing units; 1 unit is not a real length) ---- */
const BL=3.0, BW=.34, NB=5, HW=NB*BW/2, BT=.2, ST=.12, SW=.09, NL=3;
const SU=[.12,.81,1.5,2.19,2.88]; // spacer stick positions along a board
const RZ=.34, Z0=.42, RH=1.95, UY=1.02; // rack beam top, stack base, upright height, post line
const XB=[3.6,7.0,10.4,13.8]; // rack frames; bay k runs from XB[k] to XB[k+1]
const SX=k=>XB[k]+.2; // stack start in bay k
const ZD=.42, XP0=.1; // chain deck top, pack start at rest
const GX0=-.9, GX1=7.0, GY=1.5, GZ=3.0, ZI=2.15; // gantry legs, beam height, lifter idle height
const XPc=XP0+BL/2, XSc=SX(0)+BL/2; // lifter over the pack, over bay 1
const WY=-3.0, WX=-1.6, ZW=2.9; // far wall, end wall, wall height
const ZC=1.3; // outfeed roller top: level with the raised stack's top layer
const XC0=13.95, XC1=18.4; // outfeed roller conveyor
const FANS=[5.3,8.7,12.1], FZ=2.2;
const LOG=[10.4,UY+.08,1.18]; // logger on the near upright
let MAT=null; // material palette, set only while the exploded moment draws
const st={m:'steel'},dk={m:'dark'};

/* ---- timeline ---- */
const stepOf=t=>stepIndex(((t%DUR)+DUR)%DUR,BND);
const win=(t,a,b,r=.5)=>seg(t,a,a+r)*(1-seg(t,b-r,b));
const f3=v=>v.toFixed(3);
// Delivery: the pack runs in on the chain deck and stops under the gantry.
const packX=t=>lerp(-3.6,XP0,ease(seg(t,.3,3.7)));
const packMv=t=>t>.3&&t<3.7;
// Sticker: three cycles, one layer each. Lifter x and height over the cycle.
const CY0=5.3, CYL=2.6;
const zTopPack=n=>ZD+n*BT; // top of a pack with n layers
const zLay=i=>Z0+i*(BT+ST); // bottom of stack layer i
function cyc(t){const i=Math.floor((t-CY0)/CYL);if(t<CY0||i>2)return null;return{i,u:t-CY0-i*CYL};}
function lifter(t){const c=cyc(t);if(!c)return{x:XPc,z:ZI,carry:-1};const{i,u}=c,zp=zTopPack(NL-i),zs=zLay(i)+BT;
 if(u<.35)return{x:XPc,z:lerp(ZI,zp,ease(u/.35)),carry:-1};
 if(u<.45)return{x:XPc,z:zp,carry:-1};
 if(u<.8)return{x:XPc,z:lerp(zp,ZI,ease((u-.45)/.35)),carry:i,mv:1};
 if(u<1.4)return{x:lerp(XPc,XSc,ease((u-.8)/.6)),z:ZI,carry:i,mv:1};
 if(u<1.75)return{x:XSc,z:lerp(ZI,zs,ease((u-1.4)/.35)),carry:i,mv:1};
 if(u<1.85)return{x:XSc,z:zs,carry:-1};
 if(u<2.1)return{x:XSc,z:lerp(zs,ZI,ease((u-1.85)/.25)),carry:-1};
 return{x:lerp(XSc,XPc,ease((u-2.0)/.6)),z:ZI,carry:-1};}
const packLayers=t=>{const c=cyc(t);if(t<CY0)return NL;if(!c)return 0;return NL-c.i-(c.u>=.45?1:0);};
const bayLayers=t=>{const c=cyc(t);if(t<CY0)return 0;if(!c)return NL;return c.i+(c.u>=1.75?1:0);};
// Sticks for layer i (1, 2) slide out of the placer and drop onto layer i-1.
const ZSP=1.25;
function sticksFor(t,i){if(t<CY0)return null;const c=cyc(t);if(!c)return{y:0,z:zLay(i-1)+BT,k:1};
 if(c.i<i)return null;if(c.i>i)return{y:0,z:zLay(i-1)+BT,k:1};
 const u=c.u;if(u<.02)return null;
 return{y:lerp(-1.95,0,ease(seg(u,0,.5))),z:lerp(ZSP,zLay(i-1)+BT,ease(seg(u,.5,.75))),k:seg(u,0,.75),mv:u<.75};}
// Condition: tones even out, the sample board's reading falls into the target band.
const condP=t=>ease(seg(t,13.4,22.6));
const meter=t=>lerp(.78,.3,ease(seg(t,18.8,22.6))); // gauge position, 0 dry to 1 wet; schematic
// Release: the lift table raises the oldest stack so its top layer is level with the rollers.
const liftK=t=>ease(seg(t,24.1,24.9))*(1-ease(seg(t,31.0,31.6)));
const liftMv=t=>(t>24.1&&t<24.9);
const ZT0=.34, ZT1=ZC-2*(BT+ST)-.08; // lift platform top, lowered and raised
const zTable=t=>lerp(ZT0,ZT1,liftK(t));
// Boards 4 and 3 (nearest first) are pushed lengthwise onto the rollers, then carried out.
const REL=[{b:4,y0:25.0,p0:25.4,p1:26.4,c0:26.4,c1:28.6,xe:15.2},{b:3,y0:27.6,p0:28.0,p1:29.0,c0:29.0,c1:30.6,xe:12.95}];
const PUSH=1.5;
function relX(r,t){const x0=SX(2);if(t<r.p0)return x0;if(t<r.p1)return x0+PUSH*ease(seg(t,r.p0,r.p1));return lerp(x0+PUSH,r.xe,ease(seg(t,r.c0,r.c1)));}
const relMv=(r,t)=>t>r.p0&&t<r.c1;
const relOut=(r,t)=>t>=r.p0;
// Pusher: carriage runs across to the board, the rod pushes, then retracts and parks.
const bY=b=>-HW+(b+.5)*BW;
function pusher(t){let y=-1.05,s=0;
 for(const r of REL){if(t>=r.y0-.4)y=lerp(y,bY(r.b),ease(seg(t,r.y0-.4,r.y0+.2)));
  s=Math.max(s,t<r.p0?0:t<r.p1?ease(seg(t,r.p0,r.p1)):1-ease(seg(t,r.p1,r.p1+.5)));}
 y=lerp(y,-1.05,ease(seg(t,30.0,30.8)));
 return{y,s,mv:REL.some(r=>t>r.p0&&t<r.p1)};}

/* ---- memo: identical machine states reuse their markup ---- */
const MEMO=new Map();
const memo=(key,fn)=>{if(MAT)key+='|m';let v=MEMO.get(key);if(v===undefined){if(MEMO.size>3000)MEMO.clear();v=fn();MEMO.set(key,v);}return v;};
const face=(c,pts,o)=>{o=o||{};return`<path d="${pd(pts.map(p=>c.P(...p)))}" fill="${o.fill||S.paper}" stroke="${o.col||S.ink}" stroke-width="${o.w||1}" stroke-linejoin="round"/>`;};
const sp=(pts,col,w,dash,op)=>`<path d="${pd(pts,false)}" fill="none" stroke="${col}" stroke-width="${w}" ${dash?`stroke-dasharray="${dash}"`:''} stroke-linecap="round" stroke-linejoin="round" ${op!=null?`opacity="${n1(op)}"`:''}/>`;

/* ---- timber: boards, packs, spacer sticks ---- */
// Wetness per board, schematic: the same board keeps its wetness wherever it goes.
const WET=(l,b)=>{const v=Math.sin(l*12.9898+b*78.233+1.3)*43758.5453;return v-Math.floor(v);};
const tone=(base,spread,l,b)=>clamp(base+spread*(WET(l,b)-.5)*.16,0,.34);
const wood=k=>mixHex(S.paper,S.ink,k);
function board(c,x0,x1,y0,y1,z0,o){o=o||{};const z1=z0+BT,P=c.P;let s='';
 const fill=MAT?MAT.wood:o.k!=null?wood(o.k):S.paper;
 s+=xt(c,'yz',rr(y0,z0,y1,z1),x0,x1,{timber:1,fill,mv:o.mv});
 s+=`<path d="${hatchRect(P,x1,y0,y1,z0,z1,.06,1)}" stroke="${o.mv?S.acc:S.ink}" stroke-width=".45" fill="none"/>`;
 if(MAT){let g=[];for(const f of[.3,.62,.84]){const y=lerp(y0,y1,f),pts=[];for(let k=0;k<=12;k++){const x=lerp(x0+.1,x1-.1,k/12);pts.push([x,y+.025*Math.sin(k*1.3+f*9),z1]);}g.push(pts);}
  s+=edges(c,g,{w:.45,col:MAT.grain});}
 return s;}
function stick(c,x,y0,y1,z0,o){o=o||{};const fill=MAT?MAT.wood:S.paper;
 return xt(c,'xz',rr(x-SW/2,z0,x+SW/2,z0+ST),y0,y1,{stick:1,fill,mv:o.mv});}
const stickRow=(c,x0,z0,o)=>SU.map(u=>stick(c,x0+u,-HW-.06,HW+.06,z0,o)).join('');
// A stickered stack: layers bottom up, far boards first, a row of sticks on every layer but the top.
// k(l,b) gives each board's tone; skip(l,b) leaves out boards already released.
function stack(c,x0,layers,z0,k,o){o=o||{};let s='';
 for(let l=0;l<layers;l++){const z=z0+l*(BT+ST);
  for(let b=0;b<NB;b++){if(o.skip&&o.skip(l,b))continue;s+=board(c,x0,x0+BL,-HW+b*BW,-HW+(b+1)*BW,z,{k:k(l,b),mv:o.mv});}
  if(l<layers-1)s+=stickRow(c,x0,z+BT,{mv:o.mv});}
 return s;}
// The pack as it comes from the sawmill: layers tight together, two steel bands round it.
function pack(c,x0,layers,k,o){o=o||{};let s='';
 for(let l=0;l<layers;l++)for(let b=0;b<NB;b++)s+=board(c,x0,x0+BL,-HW+b*BW,-HW+(b+1)*BW,ZD+l*BT,{k:k(l,b),mv:o.mv});
 if(o.bands){const z1=ZD+layers*BT+.01;for(const u of[.5,BL-.5]){const x=x0+u;
  s+=edges(c,[[[x,-HW-.01,z1],[x,HW+.01,z1],[x,HW+.01,ZD+.01]]],{w:1.1,col:o.mv?S.acc:S.ink});
  s+=hexes(c,'xy',[[x,.15]],z1,.035);}}
 return s;}

/* ---- the store: floor, far wall with fans, end wall with the intake door, climate unit ---- */
function farWall(c){let s='';const x0=WX,x1=16.6;
 s+=xt(c,'xz',rr(x0,0,x1,ZW),WY-.12,WY,{});
 let j=[];for(const z of[.97,1.94])j.push([[x0,WY,z],[x1,WY,z]]);
 for(let x=x0+1.2;x<x1;x+=1.2)j.push([[x,WY,0],[x,WY,ZW]]);
 s+=edges(c,j,{w:.4,col:S.hid});
 // Wall columns, H sections, with base plates
 for(let x=x0+.2;x<x1;x+=3.9){s+=xt(c,'xy',rr(x-.16,WY,x+.16,WY+.12),0,ZW,st)+edges(c,[[[x,WY+.12,.05],[x,WY+.12,ZW-.05]]],{w:.4});
  s+=xt(c,'xy',rr(x-.22,WY,x+.22,WY+.22),0,.04,dk)+hexes(c,'xy',[[x-.14,WY+.16],[x+.14,WY+.16]],.04,.03);}
 return s;}
// Wall fan: square mounting plate bolted to the wall, short shroud, motor on spokes, wire guard.
function fan(c,x){let s='';const z=FZ,y0=WY,y1=WY+.34,r=.42;
 s+=xt(c,'xz',rr(x-.55,z-.55,x+.55,z+.55),y0,y0+.05,st);
 s+=hexes(c,'xz',[[x-.47,z-.47],[x+.47,z-.47],[x-.47,z+.47],[x+.47,z+.47]],y0+.05,.035);
 s+=cyl(c,'y',x,z,r,y0+.05,y1,st,28);
 s+=rings(c,'xz',[[x,z]],y1,r*.82,{n:28,w:.4})+rings(c,'xz',[[x,z]],y1,r*.58,{n:24,w:.4})+rings(c,'xz',[[x,z]],y1,r*.34,{n:20,w:.4});
 let sk=[];for(let k=0;k<6;k++){const a=k*Math.PI/3+.2;sk.push([[x+.12*Math.cos(a),y1,z+.12*Math.sin(a)],[x+r*Math.cos(a),y1,z+r*Math.sin(a)]]);}
 s+=edges(c,sk,{w:.4});
 s+=cyl(c,'y',x,z,.12,y1-.08,y1+.05,dk,14)+rings(c,'xz',[[x,z]],y1+.05,.04,{n:8});
 return s;}
// Climate unit, unnamed: cabinet on a plinth, louvred intake, access doors, pipe stubs, duct riser.
function climate(c){let s='';const x0=14.5,x1=16.3,y0=WY+.05,y1=WY+.9,zt=2.25;
 s+=xt(c,'xy',rr(x0+.04,y0,x1-.04,y1-.04),0,.1,dk);
 s+=xt(c,'xy',rr(x0,y0,x1,y1),.1,zt,st);
 const L=[];for(let z=1.35;z<2.1;z+=.09)L.push([[x0+.12,y1,z],[x0+.8,y1,z]]);
 L.push([[x0+.95,y1,.2],[x1-.1,y1,.2],[x1-.1,y1,2.12],[x0+.95,y1,2.12],[x0+.95,y1,.2]]);
 L.push([[x0+.1,y1,.2],[x0+.82,y1,.2],[x0+.82,y1,1.22],[x0+.1,y1,1.22],[x0+.1,y1,.2]]);
 s+=edges(c,L,{w:.45});
 for(const z of[.7,1.6])s+=xt(c,'xz',rr(x0+1.0,z,x0+1.06,z+.14),y1,y1+.04,dk);
 s+=xt(c,'xz',rr(x0+.6,.68,x0+.66,.82),y1,y1+.04,dk);
 for(const z of[.35,.6])s+=cyl(c,'x',y1-.25,z,.05,x1,x1+.25,dk,10);
 s+=cyl(c,'z',x0+1.4,y0+.4,.24,zt,ZW+.2,st,16)+cyl(c,'z',x0+1.4,y0+.4,.27,zt,zt+.06,dk,16);
 return s;}
function endWall(c){let s='';const a=WX-.12,b=WX,dy=1.12,zd=2.25;
 s+=xt(c,'yz',[[WY,0],[-dy,0],[-dy,ZW],[WY,ZW]],a,b,{});
 s+=xt(c,'yz',[[dy,0],[1.7,0],[1.7,ZW],[dy,ZW]],a,b,{});
 s+=xt(c,'yz',rr(-dy,zd,dy,ZW),a,b,{});
 s+=edges(c,[[[b,WY,.97],[b,-dy,.97]],[[b,WY,1.94],[b,-dy,1.94]],[[b,dy,.97],[b,1.7,.97]],[[b,dy,1.94],[b,1.7,1.94]]],{w:.4,col:S.hid});
 // Roller door: guide channels and the coil box over the opening
 for(const y of[-dy-.02,dy-.06])s+=xt(c,'xy',rr(b,y,b+.1,y+.08),0,zd,st);
 s+=cyl(c,'y',b+.2,zd+.22,.18,-dy-.05,dy+.05,st,16)+xt(c,'yz',rr(-dy-.12,zd+.02,-dy-.05,zd+.42),b,b+.38,dk)+xt(c,'yz',rr(dy+.05,zd+.02,dy+.12,zd+.42),b,b+.38,dk);
 s+=edges(c,[[[b+.06,-dy,zd-.05],[b+.06,dy,zd-.05]]],{w:.9});
 return s;}

/* ---- chain deck at the intake: frame, three chain strands, sprockets, drive ---- */
function deck(c){let s='';const x0=WX+.15,x1=XP0+BL+.25,yy=[-.62,0,.62];
 for(const x of[x0+.3,(x0+x1)/2,x1-.3])for(const y of[-.72,.72]){s+=xt(c,'xy',rr(x-.12,y-.1,x+.12,y+.1),0,.035,dk)+hexes(c,'xy',[[x-.07,y],[x+.07,y]],.035,.022);
  s+=xt(c,'xy',rr(x-.045,y-.045,x+.045,y+.045),.035,ZD-.12,st);}
 for(const x of[x0+.3,(x0+x1)/2,x1-.3])s+=xt(c,'yz',rr(-.72,.12,.72,.17),x-.025,x+.025,dk);
 for(const y of[-.72,.72])s+=xt(c,'yz',rr(y-.05,ZD-.16,y+.05,ZD-.06),x0,x1,st);
 for(const y of yy){s+=xt(c,'yz',rr(y-.04,ZD-.1,y+.04,ZD-.03),x0+.1,x1-.1,dk);
  let d=[];for(let x=x0+.15;x<x1-.12;x+=.14)d.push([[x,y-.035,ZD],[x,y+.035,ZD]]);
  s+=edges(c,[[[x0+.12,y-.035,ZD],[x1-.12,y-.035,ZD]],[[x0+.12,y+.035,ZD],[x1-.12,y+.035,ZD]]],{w:.6})+edges(c,d,{w:.4});
  for(const x of[x0+.12,x1-.12])s+=cyl(c,'y',x,ZD-.08,.08,y-.04,y+.04,st,12);}
 for(const x of[x0+.12,x1-.12])s+=cyl(c,'y',x,ZD-.08,.025,-.72,.82,dk,8);
 // Geared motor on the near side, driving the head shaft
 const mx=x1-.12;s+=xt(c,'xz',rr(mx-.2,.12,mx+.2,.42,.02),.82,1.02,st)+cyl(c,'y',mx,.27,.11,1.02,1.4,st,14);
 s+=edges(c,[1.12,1.22,1.32].map(y=>circ(mx,.27,.11,14).slice(0,8).map(p=>[p[0],y,p[1]])),{w:.4});
 s+=xt(c,'xy',rr(mx-.06,1.1,mx+.06,1.24),.37,.44,dk);
 return s;}

/* ---- pallet rack: upright frames, step beams, cross bars, top ties ---- */
function post(c,x,y){let s='';
 s+=xt(c,'xy',rr(x-.13,y-.1,x+.13,y+.1),0,.035,dk)+hexes(c,'xy',[[x-.08,y],[x+.08,y]],.035,.025);
 s+=xt(c,'xy',rr(x-.05,y-.045,x+.05,y+.045),.035,RH,st);
 let d=[];for(let z=.2;z<RH-.1;z+=.12)d.push([[x-.02,y+.045,z],[x-.02,y+.045,z+.05]],[[x+.02,y+.045,z],[x+.02,y+.045,z+.05]]);
 s+=edges(c,d,{w:.4});
 s+=xt(c,'xy',rr(x-.06,y-.055,x+.06,y+.055),RH,RH+.03,dk);
 return s;}
// Frame bracing in the plane x = const between the far and near posts.
function lacing(c,x,full){let s='';
 s+=xt(c,'yz',rr(-UY+.05,.14,UY-.05,.2),x-.02,x+.02,dk);
 s+=xt(c,'yz',rr(-UY+.05,RH-.12,UY-.05,RH-.06),x-.02,x+.02,dk);
 if(full){const pts=[];const n=4;for(let k=0;k<=n;k++)pts.push([x,k%2?UY-.05:-UY+.05,lerp(.2,RH-.12,k/n)]);
  s+=hose(c,pts,.9);}
 return s;}
function beam(c,x0,x1,y){let s='';const sg=y<0?-1:1;
 s+=xt(c,'yz',rr(y-sg*.01-.03,RZ-.13,y-sg*.01+.03,RZ),x0+.06,x1-.06,st);
 s+=edges(c,[[[x0+.06,y+.02,RZ-.065],[x1-.06,y+.02,RZ-.065]]],{w:.4});
 for(const x of[x0+.06,x1-.12])s+=xt(c,'yz',rr(y-.04,RZ-.16,y+.04,RZ+.02),x,x+.06,dk);
 return s;}
function crossBars(c,x0){let s='';for(const u of[.35,BL-.35]){const x=x0+u;s+=xt(c,'xz',rr(x-.04,RZ,x+.04,Z0),-UY+.02,UY-.02,st);}return s;}
function topTie(c,x0,x1,y){return xt(c,'yz',rr(y-.03,RH-.1,y+.03,RH-.02),x0+.05,x1-.05,st);}
// The logger on the near upright: box, display window, cable gland.
function logger(c){const[x,y,z]=LOG;let s='';
 s+=xt(c,'xy',rr(x-.16,y,x+.16,y+.12),z-.2,z+.2,st);
 s+=edges(c,[[[x-.11,y+.12,z+.02],[x+.11,y+.12,z+.02],[x+.11,y+.12,z+.15],[x-.11,y+.12,z+.15],[x-.11,y+.12,z+.02]]],{w:.6});
 s+=cyl(c,'z',x-.06,y+.06,.025,z-.27,z-.2,dk,8);
 return s;}
// Moisture pins in the sample board's near face (bay 2, middle layer), cable to the logger.
const PINX=[9.2,9.45];
function pins(c,z,o){o=o||{};let s='';const yf=HW;
 for(const x of PINX){s+=cyl(c,'y',x,z,.025,yf,yf+.13,{},8)+hexes(c,'xz',[[x,z]],yf+.06,.04)+cyl(c,'y',x,z,.03,yf+.13,yf+.17,dk,8);}
 if(!o.nocable){const zz=z;s+=hose(c,bez([PINX[0],yf+.17,zz],[PINX[0],yf+.32,zz-.15],[XB[2]-.9,UY+.2,zz-.3],[XB[2]-.6,UY+.18,zz-.3],8),.9);
  s+=hose(c,bez([PINX[1],yf+.17,zz],[PINX[1],yf+.28,zz-.1],[XB[2]-.85,UY+.2,zz-.28],[XB[2]-.6,UY+.18,zz-.3],8),.9);
  s+=hose(c,bez([XB[2]-.6,UY+.18,zz-.3],[XB[2]-.3,UY+.2,zz-.35],[LOG[0]-.06,LOG[1]+.12,LOG[2]-.5],[LOG[0]-.06,LOG[1]+.06,LOG[2]-.27],8),1.2);}
 return s;}

/* ---- release bay: scissor lift table, pusher, outfeed roller conveyor ---- */
function liftTable(c,zt,mv){let s='';const x0=SX(2)+.05,x1=SX(2)+BL-.05;
 s+=xt(c,'xy',rr(x0,-.72,x1,.72),0,.08,dk)+hexes(c,'xy',[[x0+.1,-.62],[x1-.1,-.62],[x0+.1,.62],[x1-.1,.62]],.08,.03);
 const h=zt-.06-.1,dx=Math.sqrt(Math.max(.01,1.5*1.5-h*h)),xm=(x0+x1)/2;
 for(const y of[-.62,.62]){const a=[xm-dx/2,.12],b=[xm+dx/2,zt-.06],c2=[xm+dx/2,.12],d=[xm-dx/2,zt-.06];
  for(const[p,q]of[[a,b],[c2,d]])s+=xt(c,'xz',cap2(p,q,.05,.05),y-.03,y+.03,{m:'steel',mv});
  s+=cyl(c,'y',xm,(.12+zt-.06)/2,.04,y-.05,y+.05,dk,8);}
 s+=cyl(c,'z',xm-.4,0,.07,.1,zt-.12,{m:'steel',mv},12);
 s+=xt(c,'xy',rr(x0,-.74,x1,.74),zt-.06,zt,{m:'steel',mv});
 for(const u of[.35,BL-.35]){const x=SX(2)+u;s+=xt(c,'xz',rr(x-.04,zt,x+.04,zt+.08),-.72,.72,st);}
 return s;}
// Pusher on the frame's top cross member: carriage across the stack, cylinder, rod and push plate.
const ZPU=ZC+BT+.14;
function pusherDraw(c,p){let s='';const x=XB[2]+.05,y=p.y,ext=PUSH*p.s;
 s+=xt(c,'yz',rr(-UY-.05,RH-.02,UY+.05,RH+.08),x-.06,x+.06,st);
 s+=xt(c,'yz',rr(y-.1,RH-.12,y+.1,RH-.02),x-.1,x+.1,dk);
 s+=xt(c,'xy',rr(x-.03,y-.03,x+.03,y+.03),ZPU+.06,RH-.12,dk);

function conveyor(c,front){let s='';const x0=XC0,x1=XC1,zt=ZC,W=.86;
 const legs=y=>{let o='';for(const x of[x0+.3,(x0+x1)/2,x1-.3]){o+=xt(c,'xy',rr(x-.12,y-.1,x+.12,y+.1),0,.035,dk)+hexes(c,'xy',[[x-.07,y],[x+.07,y]],.035,.022);o+=xt(c,'xy',rr(x-.045,y-.045,x+.045,y+.045),.035,zt-.2,st);}return o;};

 s+=legs(W);s+=xt(c,'yz',CH(W,-1),x0,x1,st);

 s+=xt(c,'xy',rr(x-.17,y-.17,x+.17,y+.17),0,.04,dk)+hexes(c,'xy',[[x-.11,y-.11],[x+.11,y-.11],[x-.11,y+.11],[x+.11,y+.11]],.04,.025);

// Tones: the new pack is wet and uneven; bay 2 dries as it conditions; bay 3 is even and dry.
function tones(t){const p=condP(t);
 return{pack:{base:.22,spread:1},b0:{base:lerp(.22,.15,p),spread:lerp(1,.7,p)},
  b1:{base:lerp(.14,.025,p),spread:lerp(.85,.12,p)},b2:{base:.02,spread:.1}};}

const q2=v=>v.toFixed(2);
function drawScene(c,t,flags){let s='';const ra=seamA(t,flags),T=tones(t);
 const sub=x=>ra>.995?x:`<g opacity="${n1(ra)}">${x}</g>`;
 const L=lifter(t),zt=zTable(t),pu=pusher(t);
 s+=memo('floor',()=>S.floor(c));
 s+=memo('walls',()=>farWall(c)+FANS.map(x=>fan(c,x)).join('')+climate(c)+endWall(c));
 s+=memo('gantryFar',()=>gLeg(c,GX0,-GY)+gLeg(c,GX1,-GY)+gBeam(c,-GY));
 s+=memo('placer',()=>placer(c));
 // Sticks sliding out of the placer pass behind the far rack line
 s+=memo('deck',()=>deck(c));
 // Pack on the deck (Delivery, then emptied layer by layer)
 const pl=packLayers(t);
 if(ra>.005&&pl>0){const x=packX(t),mv=packMv(t);
  s+=sub(memo(`pack|${f3(x)}|${pl}|${mv}|${t<CY0}`,()=>pack(c,x,pl,(l,b)=>tk(T.pack,l,b),{bands:t<CY0,mv})));}
 // Rack, far side, then bay by bay with the frame between bays
 s+=memo('rackFar',()=>XB.map(x=>post(c,x,-UY)).join('')+[0,1].map(k=>beam(c,XB[k],XB[k+1],-UY)).join('')+[0,1,2].map(k=>topTie(c,XB[k],XB[k+1],-UY)).join(''));
 const bl=bayLayers(t);
 for(let k=0;k<3;k++){
  s+=memo('lace'+k,()=>lacing(c,XB[k],1)+(k<2?crossBars(c,SX(k)):''));
  if(k===2)s+=memo(`lift|${f3(zt)}|${liftMv(t)}`,()=>liftTable(c,zt,liftMv(t)));
  if(ra<=.005)continue;
  if(k===0){
   // Sticks for layers 1 and 2: in flight from the placer, or in place
   const fly=[1,2].map(i=>({i,q:sticksFor(t,i)})).filter(o=>o.q&&o.q.k<1);
   const placed=[1,2].filter(i=>{const q=sticksFor(t,i);return q&&q.k>=1;});
   s+=sub(memo(`b0|${bl}|${placed.length}|${q2(T.b0.base)}|${q2(T.b0.spread)}`,()=>{let o='';
    for(let l=0;l<bl;l++){for(let b=0;b<NB;b++)o+=board(c,SX(0),SX(0)+BL,-HW+b*BW,-HW+(b+1)*BW,zLay(l),{k:tk(T.b0,NL-1-l,b)});
     if(placed.includes(l+1))o+=stickRow(c,SX(0),zLay(l)+BT);}
    return o;}));
   for(const{i,q}of fly)s+=sub(SU.map(u=>stick(c,SX(0)+u,q.y-HW-.06,q.y+HW+.06,q.z,{mv:q.mv})).join(''));}
  if(k===1)s+=sub(memo(`b1|${q2(T.b1.base)}|${q2(T.b1.spread)}`,()=>stack(c,SX(1),NL,Z0,(l,b)=>tk(T.b1,l,b,5))+pins(c,zLay(1)+BT/2)));
  if(k===2){const z0=zt+.08,mv=liftMv(t),gone=REL.filter(r=>relOut(r,t)).map(r=>r.b);
   s+=sub(memo(`b2|${f3(z0)}|${mv}|${gone.join(',')}`,()=>stack(c,SX(2),NL,z0,(l,b)=>tk(T.b2,l,b,9),{mv,skip:(l,b)=>l===NL-1&&gone.includes(b)})));}
 }
 s+=memo('lace3',()=>lacing(c,XB[3],0));
 s+=memo(`push|${f3(pu.y)}|${f3(pu.s)}|${pu.mv}`,()=>pusherDraw(c,pu));
 s+=memo('convBack',()=>conveyor(c,0));
 // Boards released: pushed off the raised stack and carried out on the rollers
 if(ra>.005)for(const r of REL)if(relOut(r,t)){const x=relX(r,t),mv=relMv(r,t);
  s+=sub(board(c,x,x+BL,-HW+r.b*BW,-HW+(r.b+1)*BW,ZC,{k:tk(T.b2,NL-1,r.b,9),mv}));}
 s+=memo('convFront',()=>conveyor(c,1));
 // Near side of the rack, drawn over the stacks
 s+=memo('rackNear',()=>XB.map(x=>post(c,x,UY)).join('')+[0,1].map(k=>beam(c,XB[k],XB[k+1],UY)).join('')+logger(c));
 // Gantry, near side, then the bridge and lifter with any layer it carries
 if(ra>.005&&L.carry>=0){const i=L.carry,x0=L.x-BL/2;
  s+=sub(memo(`carry|${f3(L.x)}|${f3(L.z)}|${i}`,()=>{let o='';for(let b=0;b<NB;b++)o+=board(c,x0,x0+BL,-HW+b*BW,-HW+(b+1)*BW,L.z-BT,{k:tk(T.pack,NL-1-i,b),mv:1});return o;}));}
 s+=memo(`lifter|${f3(L.x)}|${f3(L.z)}`,()=>lifterDraw(c,L.x,L.z)+sp([c.P(L.x-.06,0,L.z+.34),c.P(L.x-.06,0,GZ+.33+.62)],S.ink,.7)+sp([c.P(L.x+.06,0,L.z+.34),c.P(L.x+.06,0,GZ+.33+.62)],S.ink,.7));
 s+=memo('gantryNear',()=>gLeg(c,GX0,GY)+gLeg(c,GX1,GY)+gBeam(c,GY));
 s+=memo(`bridge|${f3(L.x)}`,()=>bridge(c,L.x));
 return s;}
// Stick placer, far side of bay 1: a magazine on four legs; a pusher slides a row of sticks out.
function placer(c){let s='';const x0=SX(0)-.05,x1=SX(0)+BL+.05,y0=-2.85,y1=-1.02,z0=ZSP-.06,z1=ZSP+.5;
 for(const x of[x0+.15,x1-.15])for(const y of[y0+.15,y1-.15]){s+=xt(c,'xy',rr(x-.1,y-.1,x+.1,y+.1),0,.035,dk)+xt(c,'xy',rr(x-.04,y-.04,x+.04,y+.04),.035,z0,st);}

 {id:'L0',off:[0,0,.80],slot:[1.4,0,Z0],lab:'bottom layer',top:[DL,DY0+DN*BW,Z0+BT/2],dir:[1,0],draw:dLayer(0)},

   s+=hose(c,bez([1.0,DY0+DN*BW+.17,DPZ],[1.0,DY0+DN*BW+.4,DPZ-.1],[.6,DY0+DN*BW+.45,DPZ-.25],[1.25,DY0+DN*BW+.45,DPZ-.3],6),.9);
   s+=hose(c,bez([1.25,DY0+DN*BW+.17,DPZ],[1.25,DY0+DN*BW+.36,DPZ-.08],[.7,DY0+DN*BW+.42,DPZ-.22],[1.25,DY0+DN*BW+.45,DPZ-.3],6),.9);return s;}},
 {id:'S1',off:[0,0,2.00],slot:[1.4,0,Z0+2*BT+ST],lab:'spacer sticks',top:[DL-.2+.045,DY0+DN*BW+.06,Z0+2*BT+ST+ST/2],dir:[1,0],draw:dSticks(1)},

function air(c,t,fl){const a=fl.static?1:win(t,12.6,24.0,.6);if(a<.01)return'';const k=kk(),P=c.P,col=S.hid;let s='';
 const ph=fl.static?0:(t*14)%7;
 for(const[i,x]of FANS.entries()){if(i===2)continue;
  const pts=bez([x,WY+.45,FZ-.1],[x,-1.6,FZ-.3],[x-.2,-1.2,1.55],[x-.4,-.6,1.25],10).map(p=>P(...p));

 s+=`<path d="M${n1(x0)} ${n1(y0)}H${n1(x0+w)}V${n1(y0+h)}H${n1(x0)}Z" fill="${S.paper}" stroke="${S.ink}" stroke-width=".9"/>`;

 let tks='';for(let i=1;i<10;i++){const x=mx(i/10);tks+=`M${n1(x)} ${n1(y0+h)}L${n1(x)} ${n1(y0+h+3*k)}`;}
 s+=`<path d="${tks}" stroke="${S.ink}" stroke-width=".5" fill="none"/>`;
 s+=`<path d="M${n1(mx(lim))} ${n1(y0-3*k)}V${n1(y0+h+3*k)}" stroke="${S.ink}" stroke-width="1.6" fill="none"/>`;

 s=`<g opacity="${n1(a)}">${s}</g>`;

// The exploded detail sits above the store and widens the fit upward. Outside the hold, lift the

const LIFT=.17;

const STEPS=[

const mainC={P:mkP(0,0,30)};

/* ---- page plumbing ---- */
const $=id=>document.getElementById(id);
const svg=$('s'),root=$('g');
let VB=null;
// Loop seam: only transient parts fade, over 0.5 s at each end. The shop (bed, pins, yokes,
// track, robot) stays at full strength. Overlays always fade; a station wraps its own transient
// geometry (the rib) in seamA(t, flags) inside drawScene.
const seamA=(t,flags)=>flags&&flags.static?1:Math.min(seg(t,0,.5),1-seg(t,DUR-.5,DUR));
function frame(t,flags){
  const started=performance.now();flags=flags||{};
  const a=seamA(t,flags);
  let inner=drawScene(mainC,t,flags);
  const over=S.overlay?S.overlay(mainC,t,flags):'';
  if(over&&a>.005)inner+=`<g opacity="${n1(a)}">${over}</g>`;
  root.innerHTML=inner;
  collectAnnotations();window.__frameMS=performance.now()-started;
}
// Fit the viewBox tightly to the drawing over FIT_TIMES. The svg fills the stage and scales
// with "meet", centred, so the machine is as large as the free stage allows.
function fit(){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  // Geometry only: labels are placed inside the fitted area, so they must not widen it.
  for(const t of FIT_TIMES){root.innerHTML=drawScene(mainC,t,{})+(S.overlay?S.overlay(mainC,t,{}):'');for(const e of root.querySelectorAll('[data-label],[data-dimension]'))e.style.display='none';const b=root.getBBox();x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.width);y1=Math.max(y1,b.y+b.height);}
  const pad=24;VB=[x0-pad,y0-pad,x1-x0+2*pad,y1-y0+2*pad];svg.setAttribute('viewBox',VB.map(n1).join(' '));
  // A constant whole-drawing lift balances the main machine when exploded details leave.
  // Keep each station's scale fixed across every step. Offsets are viewBox fractions.
  const station=DRAWING_META.number;
  const lift=0;
  root.setAttribute('transform',`translate(0 ${n1(-VB[3]*lift)})`);
  svg.setAttribute('preserveAspectRatio','xMidYMid meet');
}


const factoryMedia = matchMedia('(prefers-reduced-motion: reduce)');
let factoryActive=false, factoryIntent=true, factoryRaf=0, factoryLast=0, factoryEmit=0;
let factoryTime=typeof VIEWPORT_T!=='undefined'?VIEWPORT_T:STATIC_T;
let factoryStatic=factoryMedia.matches;
let factoryDraws=0;
const factoryReady = () => window.__ready===true;
function factoryState(){
  const index=typeof stepOf==='function'?stepOf(factoryTime):0;
  const item=typeof STEPS!=='undefined'?STEPS[index]:null;
  return {id:DRAWING_META.id,title:DRAWING_META.title,duration:DUR,time:factoryTime,
    playing:!!factoryRaf,active:factoryActive,reducedMotion:factoryMedia.matches,
    step:item?item[0]:'Process overview',caption:item?item[1]:DRAWING_META.whatHappens,
    stepIndex:index,static:factoryStatic,ready:factoryReady(),renderCount:factoryDraws};
}
function factoryNotify(){

  if(parent!==window)parent.postMessage({type:'bower-factory:state',state},'*');
}
function factoryRender(){frame(factoryTime,{static:factoryStatic});factoryDraws++;}
function factoryFit(){
  // Some scenes place insets after the initial viewBox is known. Reconcile their
  // full timeline with the compact deck viewport, retaining one stable camera.
  VB=null;root.removeAttribute('transform');fit();
  if(DRAWING_META.id==='overview')return;
  const times=[...new Set([...FIT_TIMES,...(typeof REVIEW_TIMES!=='undefined'?REVIEW_TIMES:[]),STATIC_T])];
  for(let pass=0;pass<8;pass++){
    let x0=VB[0],y0=VB[1],x1=x0+VB[2],y1=y0+VB[3];
    const pad=8*Math.max(VB[2]/Math.max(1,svg.clientWidth),VB[3]/Math.max(1,svg.clientHeight));
    for(const value of times){
      frame(value,{});
      // SVG getBBox includes geometry outside clip paths. The visible inset
      // outlines already bound those details; invisible shearing tools must
      // not enlarge the camera by several metres as they leave the inset.
      for(const clipped of root.querySelectorAll('[clip-path]'))clipped.style.display='none';
      const b=root.getBBox();
      x0=Math.min(x0,b.x-pad);y0=Math.min(y0,b.y-pad);
      x1=Math.max(x1,b.x+b.width+pad);y1=Math.max(y1,b.y+b.height+pad);
    }
    if(Math.abs(x0-VB[0])+Math.abs(y0-VB[1])+Math.abs(x1-VB[0]-VB[2])+Math.abs(y1-VB[1]-VB[3])<.5)break;

}
function factoryStop(){
  if(factoryRaf)cancelAnimationFrame(factoryRaf);
  factoryRaf=0;factoryLast=0;
}
function factoryTick(now){

  if(factoryLast)factoryTime=(factoryTime+(now-factoryLast)/1000)%DUR;
  factoryLast=now;factoryStatic=false;factoryRender();
  factoryRaf=requestAnimationFrame(factoryTick);
  if(now-factoryEmit>120){factoryEmit=now;factoryNotify();}
}
function factoryStart(){
  if(factoryReady()&&factoryActive&&factoryIntent&&!document.hidden&&!factoryMedia.matches&&!factoryRaf){
    factoryLast=0;factoryRaf=requestAnimationFrame(factoryTick);
  }
}
function factorySeek(value){
  const parsed=Number(value);if(!Number.isFinite(parsed))return factoryState();
  factoryStop();factoryIntent=false;factoryStatic=false;
  factoryTime=Math.max(0,Math.min(DUR,parsed));

}
window.__ready=false;
window.__duration=DUR;
window.__reviewTimes=typeof REVIEW_TIMES!=='undefined'?REVIEW_TIMES:null;

// The file:// preview has opaque origins. Only its actual parent may issue the small
// public drawing API; no arbitrary code, URLs, storage or DOM commands are accepted.
window.addEventListener('message',async event=>{
  if(event.source!==parent||parent===window||event.data?.type!=='bower-factory:command')return;
  const {requestId,action,args}=event.data;
  const allowed={state:'getState',getState:'getState',setActive:'setActive',play:'play',pause:'pause',seek:'seek',renderStatic:'renderStatic',exportSvg:'exportSvg'};
  const method=Object.hasOwn(allowed,action)?allowed[action]:null;
  if(!method)return;
  try{
    await window.BOWER_FACTORY_READY;
    const result=window.BOWER_FACTORY[method](...(Array.isArray(args)?args:[]));
    parent.postMessage({type:'bower-factory:reply',requestId,result},'*');
  }catch(error){parent.postMessage({type:'bower-factory:reply',requestId,error:String(error?.message||error)},'*');}

})();
