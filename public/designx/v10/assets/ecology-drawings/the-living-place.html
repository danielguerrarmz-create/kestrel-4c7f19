  <main aria-label="The living place"><canvas id="siteC" role="img" aria-label="Pencil isometric of a whole site that turns slowly. A six-bay timber Bower of solid glulam arches and a fine lattice stands in a round plug of ground whose cut edge shows roots, soil layers, the water table and bedrock. Paths ring the Bower and lead to an old oak with a bench, a boardwalk over a swale and a gap in a hedge. A dashed circle marks the ground round the oak where nothing is dug, and the piers stand outside it. Around them are young trees, a meadow and people walking. Over nine years the climbers, the trees, the meadow and their roots grow."></canvas>
