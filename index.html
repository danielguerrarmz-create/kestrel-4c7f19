<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- THE HEAD IN THIS FILE DESCRIBES THE HOME PAGE, and that is also the correct fallback:
         the router serves the home splash for any path it does not recognise. Each of the four
         public routes overwrites the title, description, canonical and og:title/og:description
         on navigation (src/seo.ts, applied from Root) — which is what having real paths instead
         of `#/` hashes was for.

         DELIBERATELY ABSENT HERE: `<link rel="canonical">` and `og:url`. A static canonical would
         tell a crawler that does not run JavaScript that /gallery is a duplicate of /, which is
         the opposite of the truth and worse than having none; a static og:url would make a link
         unfurler print the home URL under a shared /questions link. Both are injected per route
         instead. See docs/handoffs/2026-07-28-routes-and-social-cards.md for what this still
         leaves on the table (unfurlers do not run JavaScript, so they all get the home's card
         copy over the correct image). -->
    <title>Bower: living architecture for gardens and landscapes</title>
    <meta
      name="description"
      content="Bower designs woven timber pavilions made for planting, gathering and long-term transformation in the landscape. Founding commissions from 2027."
    />
    <meta name="theme-color" content="#FBF9F3" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- FOR AI AGENTS AND OTHER NON-JAVASCRIPT READERS (2026-07-23): the nine public pages are
         real paths (/, /commissions, /gallery, /process, /about, /about/practice, /contact,
         /press, /questions), but fetching any
         of them still yields this shell with no page content, because the site is client-rendered.
         The whole public site is mirrored as markdown, generated from the same components the
         human pages render and drift-guarded by the test suite: start at /llms.txt, or go
         straight to the per-page mirrors listed in the <noscript> block below. -->
    <link rel="alternate" type="text/plain" href="/llms.txt" title="LLM-readable site guide" />

    <!-- SOCIAL CARDS. Rewritten 2026-07-28: the previous pair sold "a generative design engine
         constrained by a fabrication grammar" — the studio/draw tool, which came off the live site
         on 2026-07-21 — and carried NO og:image, so a pasted link showed a blank card advertising a
         product that no longer exists. The image is a real 1200x630 JPEG (not WebP: iMessage and
         WhatsApp are unreliable with it and fail to no image at all), generated from the gallery's
         wisteria walk by `npm run gen:og`. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bower" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:title" content="Bower: living architecture for gardens and cultural landscapes" />
    <meta
      property="og:description"
      content="Woven timber pavilions drawn for one landscape and gradually completed by plants, weather and life around them."
    />
    <meta property="og:image" content="https://www.bowerbuild.org/assets/social/og-card.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A walk beneath woven timber arches, wisteria hanging through the lattice, cafe tables in the shade beside it"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bower: living architecture for gardens and cultural landscapes" />
    <meta
      name="twitter:description"
      content="Woven timber pavilions drawn for one landscape and gradually completed by plants, weather and life around them."
    />
    <meta name="twitter:image" content="https://www.bowerbuild.org/assets/social/og-card.jpg" />
    <meta
      name="twitter:image:alt"
      content="A walk beneath woven timber arches, wisteria hanging through the lattice, cafe tables in the shade beside it"
    />

    <!-- Organization schema, STATIC so a crawler that does not execute JavaScript still gets it.
         Kept byte-identical to `organizationJsonLd()` in src/seo.ts, which src/seo.test.ts asserts,
         so the two cannot drift. The FAQPage schema for /questions is injected per route instead:
         it belongs to that one page, and claiming every URL is an FAQ page is a policy violation
         as well as a lie. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Bower",
        "url": "https://www.bowerbuild.org/",
        "logo": "https://www.bowerbuild.org/favicon.svg",
        "image": "https://www.bowerbuild.org/assets/social/og-card.jpg",
        "description": "Bower is a building technology company developing a repeatable system for geometrically unique timber buildings that grow into their landscapes. Each woven timber pavilion is drawn for one place and gradually completed by planting, weather and use.",
        "founder": [
          { "@type": "Person", "name": "Clay Seifert" },
          { "@type": "Person", "name": "Daniel Guerra" }
        ],
        "email": "clay@bowerbuild.org",
        "telephone": "+44 20 7139 5142"
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=Dancing+Script:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* One warm base tone everywhere (matches the vellum sections) so no beige/
         white seam ever shows behind transparent layers. */
      html,
      body {
        background: #fbf9f3;
      }
      /* Pre-JS loading state: a plain blank vellum field, no text. Replaced the
         moment React mounts, and toned to the intro backdrop so there is no flash. */
      #root:empty::after {
        content: '';
        position: fixed;
        inset: 0;
        background: #fbf9f3;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width: 40rem; margin: 4rem auto; padding: 0 1.5rem; font-family: Georgia, serif; color: #17160f; line-height: 1.6">
        <h1>Bower</h1>
        <p>
          Bower creates living architecture for gardens and cultural landscapes: woven timber
          pavilions drawn for one place and gradually completed by planting, weather and use.
        </p>
        <p>
          This site needs JavaScript to render. A full markdown mirror of every page is published
          for non-JavaScript readers:
        </p>
        <ul>
          <li><a href="/llms.txt">Site guide (llms.txt)</a></li>
          <li><a href="/agent/home.md">Home</a></li>
          <li><a href="/agent/commissions.md">Commissions</a></li>
          <li><a href="/agent/gallery.md">Gallery: concept studies of commissions</a></li>
          <li><a href="/agent/process.md">Process</a></li>
          <li><a href="/agent/questions.md">Questions: planning permission, timeline, contact</a></li>
          <li><a href="/agent/about.md">About: what a Bower is</a></li>
          <li><a href="/agent/practice.md">The company: the founders and the work</a></li>
          <li><a href="/agent/contact.md">Contact</a></li>
          <li><a href="/agent/press.md">Press</a></li>
        </ul>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
